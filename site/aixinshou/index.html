  --brand:#C2571C;--brand-dark:#E0892B;--bg:#FBF6EE;
  --sc-bg:#FBF6EE;--sc-card:rgba(251,246,238,.86);--sc-line:rgba(140,95,50,.18);
  --sc-cyan:#C2571C;--sc-dim:#7C6A57;
}
html{background:#FBF6EE}
body{background:#FBF6EE!important;color:#2B2119}
#scifi-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
   radial-gradient(760px 420px at 12% -6%,rgba(194,87,28,.14),transparent 62%),
   radial-gradient(620px 360px at 96% 4%,rgba(224,84,63,.13),transparent 60%),
   radial-gradient(700px 620px at 50% 104%,rgba(194,87,28,.07),transparent 66%),
   linear-gradient(180deg,#FBF6EE,#F3E5D2 48%,#FBF6EE)}
#scifi-bg canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.75}
#scifi-bg .g{position:absolute;left:-20%;right:-20%;bottom:-6%;height:46%;
  background-image:linear-gradient(rgba(194,87,28,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(194,87,28,.06) 1px,transparent 1px);
  background-size:46px 46px;transform:perspective(520px) rotateX(66deg);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 76%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 40%,#000 76%,transparent);
  animation:scgrid 26s linear infinite}
@keyframes scgrid{to{background-position:0 46px,46px 0}}
#scifi-bg .scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);opacity:.5}
#screen{position:relative;z-index:1;background:transparent!important;box-shadow:none!important}
#pages{position:relative;z-index:1}

/* hero：叠一张星轨图，做出“舱内视角” */
.hero{position:relative;overflow:hidden;padding-top:.42rem!important}
.hero:before{content:"";position:absolute;inset:-.2rem -.4rem auto -.4rem;height:120%;
  background:url(/img/learn-hero.webp) center/cover no-repeat;
  opacity:.55;-webkit-mask-image:radial-gradient(120% 90% at 70% 6%,#000 0%,rgba(120,70,30,.55) 46%,transparent 78%);
  mask-image:radial-gradient(120% 90% at 70% 6%,#000 0%,rgba(120,70,30,.55) 46%,transparent 78%);
  pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero-t, .hero h1{font-weight:800!important;letter-spacing:-.02em!important;
  background:linear-gradient(96deg,#ffffff 6%,#C2571C 52%,#8fb8ff 74%,#C0392B 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#fff!important}
.hero-tag{border-color:rgba(194,87,28,.46)!important;background:rgba(194,87,28,.1)!important;
  color:#C2571C!important;letter-spacing:.14em!important}
.hero-s{color:#a9b8c4!important}
.hero-line{background:linear-gradient(90deg,rgba(194,87,28,.9),transparent)!important;height:1px!important}

/* 统计条 */
.stats{border:1px solid var(--sc-line)!important;background:rgba(255,255,255,.02)!important;border-radius:.24rem!important;overflow:hidden}
.stat{border-right:1px solid rgba(140,95,50,.13)!important;position:relative}
.stat:last-child{border-right:0!important}
.stat-num{font-family:var(--mono,ui-monospace,Menlo,monospace)!important;font-weight:800!important;
  background:linear-gradient(180deg,#2B2119,#B5703E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-l{color:#7C6A57!important;letter-spacing:.06em}

/* 卡片：玻璃 + 青色细边 + 顶部光带 */
.card, .ladder-entry, .qk, .paid, .sc, .summary-item, .frow, .res, .notice, .tip{
  background:var(--sc-card)!important;
  border:1px solid var(--sc-line)!important;
  box-shadow:0 .04rem .18rem rgba(120,70,30,.45), inset 0 1px 0 rgba(255,255,255,.55)!important;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card{position:relative;overflow:hidden;border-radius:.22rem!important}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(194,87,28,.75),transparent);opacity:.75}
.card-title, .card-h{border-left-color:#C2571C!important}
.card-title:before, .card-h:before{background:#C2571C!important;box-shadow:0 0 10px rgba(194,87,28,.75)}
.press:active .card, .card:hover{border-color:rgba(194,87,28,.4)!important}

/* 主按钮：亮青 + 深字 + 光晕 */
.btn-primary{background:linear-gradient(100deg,#C2571C,#E0892B)!important;color:#04121a!important;
  border:0!important;box-shadow:0 .04rem .16rem rgba(194,87,28,.26)!important;font-weight:700!important}
.btn{font-weight:600!important}
.btn:not(.btn-primary){background:rgba(224,84,63,.12)!important;color:#ffb5a8!important;border:1px solid rgba(224,84,63,.42)!important}

/* 底部 tabbar：玻璃 + 顶部光线 */
nav#tabbar{background:linear-gradient(180deg,rgba(253,249,243,.92),rgba(253,249,243,.98))!important;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(194,87,28,.22)!important;box-shadow:0 -.06rem .3rem rgba(120,70,30,.6)!important}
nav#tabbar:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(194,87,28,.8),transparent)}
.tab.tab-on{color:#C2571C!important}
.tab.tab-on .tab-img{filter:none!important}
.tab{color:#A8998A!important}

/* 分区标题 */
.sec-head-t{font-weight:800!important;letter-spacing:-.01em}
.sec-head-t:before{background:#C2571C!important;box-shadow:0 0 12px rgba(194,87,28,.8)}
.sec-head-s{color:#A8998A!important;font-family:var(--mono,ui-monospace,monospace)!important;letter-spacing:.08em}
.muted{color:#7C6A57!important}
.divider, .dv{background:rgba(140,95,50,.16)!important}
img{filter:none}
.footer-note{color:#5f7280!important}

/* 付费区：压暗，去暖色 */
.paid{background:linear-gradient(160deg,rgba(194,87,28,.07),rgba(224,84,63,.05) 70%,rgba(251,246,238,.9))!important}


/* 输入/选择/复制等控件统一切到暗色 */
input, textarea, select{background:rgba(255,255,255,.045)!important;border:1px solid rgba(140,95,50,.24)!important;color:#2B2119!important;border-radius:.14rem!important}
input::placeholder, textarea::placeholder{color:#6f8593!important}
input:focus, textarea:focus, select:focus{border-color:rgba(194,87,28,.55)!important;box-shadow:0 0 0 .03rem rgba(194,87,28,.14)!important;outline:none!important}
.chip, .sbar-btn, .tag-chip{font-weight:600!important}
.chip-on, .sbar-btn, .tab-on-chip{background:linear-gradient(100deg,#C2571C,#E0892B)!important;color:#04121a!important;border-color:transparent!important;box-shadow:0 0 12px rgba(194,87,28,.22)!important}
.chip{background:rgba(255,255,255,.045)!important;color:#4A3A2B!important;border:1px solid rgba(140,95,50,.2)!important}
.sbar{background:rgba(255,255,255,.045)!important;border:1px solid rgba(140,95,50,.22)!important}
.btn-copy, .copy-btn, .mini-btn{background:rgba(194,87,28,.1)!important;color:#C2571C!important;border:1px solid rgba(194,87,28,.32)!important;font-weight:600!important}
.opt button{background:rgba(255,255,255,.045)!important;color:#4A3A2B!important;border:1px solid rgba(140,95,50,.2)!important}
.opt button.on{background:rgba(194,87,28,.15)!important;color:#E0892B!important;border-color:rgba(194,87,28,.55)!important;box-shadow:0 0 10px rgba(194,87,28,.16)!important}
.fac-chip{background:rgba(255,255,255,.045)!important;color:#4A3A2B!important;border:1px solid rgba(140,95,50,.2)!important}
#facNeed{background:rgba(255,255,255,.045)!important;color:#2B2119!important;border:1px solid rgba(140,95,50,.24)!important}
.res{background:linear-gradient(150deg,rgba(194,87,28,.1),rgba(251,246,238,.92))!important;color:#2B2119!important;border:1px solid rgba(194,87,28,.26)!important}
.nomore, .empty{color:#6f8593!important}
.tag, .htag{background:rgba(194,87,28,.1)!important;color:#E0892B!important;border:1px solid rgba(194,87,28,.28)!important}
.stamp{opacity:.9}
.locked .card, .card.locked{opacity:.72}

/* 滚动条 */
::-webkit-scrollbar{width:0;height:0}
</style>
</head>

<script>
(function(){
  var cv=document.querySelector('#scifi-bg canvas');if(!cv)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  function draw(){
    var w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;
    var c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
    var n=Math.round(w*h/9000);
    for(var i=0;i<n;i++){
      var x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.1+.25,a=Math.random()*.5+.1;
      c.beginPath();c.arc(x,y,r,0,6.283);
      c.fillStyle='rgba('+(Math.random()<.16?'224,84,63,':'170,225,245,')+a+')';c.fill();
    }
  }
  draw();var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,240)});
})();
</script>

<script>
(function(){
  var t0=Date.now(), done=false;
  function hide(){
    if(done) return; done=true;
    var el=document.getElementById('boot-sk'); if(!el) return;
    el.style.opacity='0'; el.style.pointerEvents='none';
    setTimeout(function(){ if(el&&el.parentNode) el.parentNode.removeChild(el); },300);
  }
  function tick(){
    var pg=document.getElementById('pages');
    if(pg && pg.children && pg.children.length>0){ hide(); return; }
    var txt=document.getElementById('boot-txt');
    if(txt && Date.now()-t0>2500) txt.textContent='还在加载，网络慢请稍等…';
    if(Date.now()-t0>20000){ hide(); return; }
    setTimeout(tick,120);
  }
  tick();
  window.addEventListener('load',function(){ setTimeout(hide,1200); });
})();
</script>

ind:"bad",title:"三个真会翻车的场景",text:"①让它算账，数字算错了还特别有信心；②让它写合同条款，写得像模像样，引的法规是编的；③让它给你报价，它按网上「看着像」的数给你报。"},{kind:"tip",title:"判断标准就一句",text:"错了要你赔钱的活，不能只听它的。"}],practice:"想想你手头哪些活是「错了要赔钱」的，单独列出来，这些活永远只让AI打草稿。"},{h:"能交给它的活",blocks:[{kind:"p",text:"判断标准：这活是不是「重复、有套路、不用你拍板」？是，就能交。"},{kind:"list",title:"能交（对号入座）",img:"fig-can-cannot.png",items:["写东西：朋友圈、宣传语、短视频脚本、通知、回复话术","理东西：一堆乱七八糟的信息整理成表格；长文章提炼成要点","改东西：改错别字、改语气、改长短、换个说法","找思路：想不出标题、活动、菜单，让它一次给10个，你挑","学东西：不懂的概念让它用大白话讲一遍，再出3道题考你","翻译：中译英、英译中，比机器翻译顺得多"]},{kind:"list",title:"别交（自己扛）",items:["看病开药、说法律定性、替你签合同","决定要不要花一笔大钱","任何需要你出面担责的事"]},{kind:"tip",title:"找目标的小窍门",text:"你一天里最烦的那件事，八成就在「能交」这一栏里。"}],practice:"按上面的标准，随手写下你今天最烦的3件事——这就是你待会儿要交的作业素材。"},{h:"跟AI说话的正确姿势",blocks:[{kind:"p",text:"这一节是整个阶段最值钱的地方。记住一个公式："},{kind:"quote",text:"身份 + 任务 + 要求 + 例子",img:"fig-formula.png"},{kind:"table",head:["场景","差的问法","好的问法"],rows:[["写文案","帮我写个文案","你是社区餐饮文案，帮我写条酸菜鱼的朋友圈，100字内，给上班族看，大白话、带点馋人劲儿"],["整理信息","帮我整理一下","把下面这堆客户信息整理成表格，列：姓名、电话、上次来的日期、备注"],["出主意","有什么好主意","给我10个工作日午餐的促销名目，都要能当天上、不用备新料的"]]},{kind:"code",title:"万能提问模板（直接抄）",text:`你是一个【身份：比如做了十年社区餐饮的老板】。
帮我【任务：比如写一条朋友圈】。
要求：【①多少字 ②给谁看 ③什么语气 ④必须包含什么 ⑤不能出现什么】。
参考这个样子：【贴一段你喜欢的、或者你自己以前写过的】。`},{kind:"good",title:"拆开看这段好在哪",text:"「你是一个社区餐饮文案」＝ 身份；「帮我写一条酸菜鱼的朋友圈」＝ 任务；「100字以内、给上班族看、大白话、带点馋人劲儿、别提美味这种空话」＝ 要求；再贴一条你喜欢的范例，它就完全贴着你的路子写。"},{kind:"steps",title:"四句加料话，效果立刻不一样",items:["「先别写，你先问我3个问题，问清楚了再动手」——逼它把需求问全","「给我3个不同风格的版本，我自己挑」——一次拿到选项，不用来回磨","「太长了，砍到一半，信息别丢」——不满意就直说怎么改","「这段里哪些是你猜的？标出来」——逼它把不确定的地方亮出来"]},{kind:"tip",title:"记住这一句",text:"同一个AI，会说话的人用得好十倍。这是小白最大的杠杆。"}],practice:"用模板给你手头的一件真活写一段提问，存到手机备忘录里——以后直接改两个字就能用。"},{h:"今天就能用的三招",blocks:[{kind:"p",text:"不用学新工具，现在就能省时间。三招，配好话术，照着念都行。"},{kind:"steps",title:"第一招：写东西",items:["把你要写的事说清楚（谁看、什么场合、要什么效果）","让它写，一次给它3个版本","你挑一个，让它按你的口气改一遍"]},{kind:"good",title:"直接抄这句话",text:"我要发一条【场合】，给【谁】看，目的是【要什么效果】。先给我3个不同风格的版本，每个100字以内，用大白话。"},{kind:"steps",title:"第二招：理东西",items:["把散在各处的信息（微信记录、手写单子）复制成一大段","告诉它要整理成什么（表格？清单？按什么排序？）","让它输出表格，你复制到Excel或腾讯文档里"]},{kind:"good",title:"直接抄这句话",text:`把下面这些信息整理成表格，列是：【姓名】【电话】【上次来的日期】【备注】。没有的信息留空，不要自己编。

【在这里粘贴那一大段】`},{kind:"steps",title:"第三招：问东西",items:["遇到不会的，别搜一堆文章","直接让它给分步骤的做法","照着做，卡在哪再问哪一步"]},{kind:"good",title:"直接抄这句话",text:"我不懂【这件事】。请给我一份分步骤的做法，每一步说清楚具体做什么，别讲原理，我要能照着做。"}],practice:"今天挑一招真用一次。用了才知道哪不对。"},{h:"六个常见的坑",blocks:[{kind:"bad",title:"早点知道，少走半年弯路",text:"①一上来就报几千块的AI培训班——先用免费的用满一周，用得顺再谈花钱；②觉得工具越多越好——一个顺手的，胜过十个装着的；③直接复制它的输出就发——至少读一遍，把不像你说的话的地方改掉；④一次问一堆问题——一次一件，答得才准；⑤把重要数字全信了——数字、日期、法规、人名，全部核；⑥指望它替你想清楚要干什么——要干什么是你的事，它只管干。"},{kind:"tip",title:"这一阶段的目标",text:"不是「会用」，是「用得比身边的人顺」。"}],practice:"对照这六条，看看你现在中了哪几条。"}],checklist:["我能用一句话说清AI能干啥、不能干啥","我知道哪些活可以交给它，哪些活必须自己扛","我能背下「身份+任务+要求+例子」这个公式","我给一件真活写过一次完整的提问","我知道它的答案哪里需要核实","我今天真的用了一次，省下了时间"],faq:[{q:"我完全不懂技术，能学会吗？",a:"这一阶段一个字的技术都不用懂。你只要会打字、会说清楚你要啥，就够了。"},{q:"要花钱买工具吗？",a:"不用。第一阶段先用手边能免费用的，把「怎么说话」练顺，这比买工具重要得多。"},{q:"它老答错，是不是我用的工具不行？",a:"不是。所有AI都会答错，尤其爱在数字和法规上编。区别在于：会不会核实，是你的事，不是工具的事。"},{q:"一次要学多久？",a:"这一阶段大概40分钟能看完。但真正的功夫在动手——你看完不练，等于没学。"},{q:"学完能挣钱吗？",a:"这一阶段不教挣钱，只教你把手头的活干快。挣钱是第4阶段的事，得一步一步来。"}],task:"交一份《我的AI使用清单》",taskDetail:"不用写字数，四栏都填满就行。写你真实在干的活，别编。",examFields:[{key:"works",label:"我平时干的活儿",hint:"至少写3件，要真实的，别写空话",type:"textarea"},{key:"pick",label:"哪件能交给AI",hint:"从上面选1-2件，得是重复、不用动脑的",type:"textarea"},{key:"how",label:"我打算怎么用",hint:"写清楚：用AI做什么、代替我干哪一步",type:"textarea"},{key:"save",label:"一天大概能省多少小时",hint:"比如「1小时」，估个实在数",type:"input"}],rubric:[{name:"列出3件以上真实活儿",max:30,hint:"写了3件及以上真实、具体的活儿算满分；泛泛而谈或不足3件扣分"},{name:'选出的活儿确实是"重复、不用动脑"的',max:30,hint:"选的是重复性、按规则来的活算满分；选了要拍板担责的活（如看病、签合同）不得分"},{name:"说得清怎么用（具体到步骤）",max:20,hint:'写清了用AI做什么、代替哪一步算满分；只说"用AI帮我干活"这类空话得0-5分'},{name:"省的时间估算合理",max:20,hint:"给出具体数字且不离谱算满分；夸张到一天省10小时以上判不合理"}]},{id:2,name:"AI用法解读",price:"99元",tagline:"用各类AI工具做出真东西",brief:"写文案、做图、做视频、做表，各类工具怎么用；提问的公式（身份+任务+要求）怎么套。",gain:"能自己做出拿得出手的东西——一条口播脚本、一张海报、一份方案，不再是只会跟它聊天。",help:"每个工具都配好现成模板和问法，复制改两个词就能出活；做出来我们再帮你改到能交付的程度。",goal:"学完你能挑对工具，独立做出一份真能用的东西——文案、表格、方案都算。",duration:"约 65 分钟",sections:[{h:"工具怎么选",blocks:[{kind:"p",text:"别指望一个工具干所有活。按需要选，才不会白费劲。"},{kind:"table",head:["工具类型","特点","适合干的活"],img:"fig-tools.png",rows:[["对话型（豆包/DeepSeek这类）","通用，会写会想会总结","写文案、想主意、总结、翻译"],["搜索型（能联网的）","能查最新的","查资料、了解行情、找案例"],["图片型","生成配图、海报","宣传配图、菜单图、门店图"],["视频/口播型","生成短视频、克隆声音","门店短视频、口播视频"],["表格/数据型","整理数据、算账","记账对账、做报表"]]},{kind:"tip",title:"记住这一句",text:"工具是干活的家伙什，不是收藏品。手里顺的留一个就够。"}],practice:"把你手机里装过的AI工具列一遍，标出哪个你上周真用过。超过3个没用过的，先卸载——留着只会分散注意力。"},{h:"实操心法",blocks:[{kind:"list",title:"四条，每天都会用到",items:["一次问一件事——问太杂它答不好，你也看不出哪错","不满意就让它改——「太啰嗦了，砍一半」「语气太硬了，软一点」","重要的事一定核实——它尤其爱在数字、政策、人名上编","拿不准的别用——涉及钱、健康、法律的，它说的都要再过一遍"]},{kind:"good",title:"改稿的正确姿势",text:"不要说「不行，重写」。要说「第一句删掉，第二段太啰嗦砍一半，结尾加一句让客户今天就来」。你说得越具体，它改得越准。"},{kind:"bad",title:"最常见的浪费",text:"不满意就整段重问一遍，来回十几次还是不对。其实只要指出「哪一句不对、要改成什么样」，一轮就到位。"}],practice:"下次它给你的东西不满意时，逼自己用「指出具体哪里+要改成什么样」这种方式提一次要求。"},{h:"把过程留痕",blocks:[{kind:"p",text:"这一阶段考试要交的不只是成品，还有「你是怎么问出来的」。所以从今天起养成一个习惯："},{kind:"steps",title:"三步留痕法",items:["问之前：把关键提问复制到备忘录","拿到结果：把成品存下来","改完之后：把你改了什么、为什么改记一行"]},{kind:"tip",title:"为什么必须这样",text:"成品看着都一样，但会提问的人下一件活还能做出来，抄答案的人下一件就卡住了。"}],practice:"今天起，每次用AI做正经活，都把提问和改动记一行。攒着，这就是你的作品集。"},{h:"这个阶段的实操",blocks:[{kind:"p",text:"挑一个你真实需要的场景，用AI做出一份真能用的东西。三个方向，任选一个："},{kind:"list",title:"可以选的方向",items:["给门店写一套宣传物料：朋友圈3条 + 短视频脚本1条 + 店铺简介1段","做一份记账/对账表：列好字段、写清算法，能直接拿去用","出一份活动方案：目标、时间、成本、谁来干、怎么算效果"]},{kind:"good",title:"什么算「真能用」",text:"明天就能拿去用、不用再大改的东西。比如那3条朋友圈，你改两个字就能发出去；那张表，你把数填进去就能对账。"},{kind:"bad",title:"什么不算",text:"「关于XX的十点建议」这种放之四海皆准的东西——看着热闹，你根本用不上，交上来也过不了。"}],practice:"先想清楚要做什么，再动手。别打开AI才开始想。"},{h:"把一件活拆开，它才接得住",blocks:[{kind:"p",text:"你觉得AI不好用，八成不是它不行，是你一口气丢给它一整件事。一件事拆成几步，每一步它都答得准；一整件压过去，它只能还你一个「看着像」的壳子。"},{kind:"steps",title:"倒着拆，三步",items:["先写结果：最后要交出去的那个东西，长什么样、给谁看、多少字","再往回推：要做出它，中间必须先有哪几样东西","一样一样单独问，问完再拼起来"]},{kind:"good",title:"拿「写一份门店宣传方案」举例",text:"不要一次要方案。拆成五步：①先定给谁看、要达到什么效果 → ②让它出3个不同的宣传角度，你挑一个 → ③按挑中的角度写3条朋友圈 → ④再写1条短视频脚本 → ⑤最后把这几样整理成一份文件。每一步你都能看懂、能改，拼起来就是一份真方案。"},{kind:"bad",title:"不拆会怎样",text:"直接说「帮我写一份完整的营销方案」，回来的是「十点建议」——看着挺全，你一条都用不上。它没偷懒，是你没给它落脚点。"},{kind:"tip",title:"记住这一句",text:"拆得越细，它答得越准，你也越省时间。这一节是这一阶段最省事的一招。"}],practice:"挑一件你真要干的活，拆成 3-5 步写在纸上，再一步步交给它。"},{h:"三个场景，各走一遍",blocks:[{kind:"p",text:"下面这三个，是这一阶段交得最多的。照着走一遍，你就摸到门路了。"},{kind:"code",title:"场景一：给门店写一套宣传物料",text:`第一步：「我是【社区小饭馆老板】，要写【一整套宣传文字】，给【附近上班族】看。先别写，先给我【3个不同的宣传角度】，每个一句话。」
第二步（挑一个角度后）：「按【这个角度】写【3条朋友圈】，每条【80字内】，大白话，别出现"美味""舌尖上的"。给我编号。」
第三步：「再写【1条30秒短视频脚本】，开头3秒要抓人，结尾让人点定位。」
第四步：「把上面这些整理成一份文件，标题叫《午市套餐宣传物料》，分三块：朋友圈 / 短视频 / 一句话介绍。」`},{kind:"code",title:"场景二：把一堆乱信息做成对账表",text:`第一步：「把下面这一大段整理成表格，列是【姓名】【电话】【上次来的日期】【消费金额】【备注】。对不上的留空，别自己编。

【粘那一大段】」
第二步：「消费金额这一列，有没有格式不统一的？有的话列出来，我确认后你改。」
第三步：「按消费金额从高到低排，先给我前20行。」
第四步：「再给我一份【三个月没来的客人】名单，只要姓名和电话。」`},{kind:"code",title:"场景三：出一份活动方案",text:`第一步：「我要在【下个月】做一次【老客回馈活动】，预算【500元】。先给我【3个不同做法的方案】，每个说清：怎么玩、花多少钱、怎么知道有没有效果。」
第二步（挑一个后）：「按【这个方案】写细：分几个阶段、每步谁干、需要提前备什么、可能出什么岔子。」
第三步：「把它整理成一张表，列是【时间】【要做的事】【谁负责】【要多少钱】。」`},{kind:"tip",title:"三个场景的共同点",text:"先定「要交什么」，再定「分几步」，最后才动手问。顺序反了，来来回回磨半天也出不来。"}],practice:"从里面挑一个，走完整一遍，把每一步的提问都存到备忘录。"},{h:"常见坑",blocks:[{kind:"bad",title:"五条",text:"①让AI替你决定方向——它只能给你选项，判断是你的活；②一次让它干一整套——拆成小步，每步都对再往下；③把它写的东西当终稿——你至少要读一遍；④不备份——做好的东西随手扔，下次还得重做；⑤不留提问记录——下次遇到同类活，又得从零摸一遍。"}],practice:"对照五条，把你不小心犯的那条记在备忘录第一行。"}],checklist:["我能说清五种类型工具各适合干什么","我知道不满意时该怎么提要求（指出具体位置+要改成什么样）","我会把一件活拆成几步，再一步步交给它","我至少完整走过一个场景（文案 / 表格 / 方案）","我做的东西能直接拿去用，不是练习稿","我留了提问记录和改动记录","我知道哪些内容必须自己核实"],faq:[{q:"我只会用一个工具，够吗？",a:"够。这一阶段不是让你全都会，是让你知道遇到什么活用什么东西。会用两三个就能应付日常了。"},{q:"做出来的东西自己觉得还行，能过吗？",a:"看标准：能不能明天直接拿去用。不能用就是不行，跟你的感觉没关系。"},{q:"要不要花钱买付费版？",a:"先不买。免费版够你把这一阶段做完。等你明确知道「差在哪、付费能解决」再买。"},{q:"提问记录要写多细？",a:"写到别人看一遍就能照着做出来，就行。"}],task:"交一份真能用的产出物（带上AI帮你做的过程）",taskDetail:'重点是"真能用"——能直接拿去用，不是练习稿。提问记录要写清。',examFields:[{key:"scene",label:"我做的什么",hint:"选一个场景，比如「给餐馆写宣传文案」",type:"input"},{key:"tool",label:"用了哪个AI工具",hint:"写工具名",type:"input"},{key:"prompt",label:"怎么问的",hint:"把关键的那几句提问原文贴出来",type:"textarea"},{key:"output",label:"做出了什么",hint:"把真东西贴进来：文案 / 表格 / 方案",type:"textarea"},{key:"edit",label:"我自己改过哪里",hint:"证明不是直接抄AI的",type:"textarea"}],rubric:[{name:"产出物是真能用的",max:40,hint:"能直接拿去干活用、内容具体实在算满分；空泛、明显凑数、放之四海皆准的模板得0-10分"},{name:"提问方式对",max:30,hint:'提问里用上了「身份+任务+要求」公式算满分；只有一句"帮我写个东西"得0-5分'},{name:"自己做过修改和核实",max:20,hint:'说清了改了什么、核实了什么算满分；写"没改，直接用"得0分'},{name:"说得出这活儿省了多少时间",max:10,hint:"有具体时间算满分；没说或含糊不得分"}]},{id:3,name:"专属工具制作",price:"999元",tagline:"做出自己的提效工具",brief:"把你最烦的那件重复活，做成一个专属工具（智能体/自动流程），让它每天自己跑。",gain:"手上多一个能反复用、也能直接卖给同行的工具，同样的活不用每次从头再干一遍。",help:"陪你把工具搭出来并跑通，顺带告诉你这东西谁会买、能卖多少，做成能换钱的东西。",goal:"学完你手上有一个真能跑的专属工具——这就是你的第一个作品。",duration:"约 80 分钟",sections:[{h:'什么叫"专属工具"',blocks:[{kind:"p",text:"就是给自己干活用的AI小工具，专治你最烦的那件活。"},{kind:"list",title:"几个真例子",items:["给销售：自动整理客户信息 + 到点提醒跟进","给店主：老客台账 + 生日和到期提醒","给教培：学员管理 + 续费到期提醒","给做手工的：订单记录 + 材料用量估算"]},{kind:"p",text:"注意这些工具的共同点：都是拿AI去填一个「重复动作」的坑，不是做个玩具炫技。"},{kind:"tip",title:"记住这一句",text:"不是为了学技术做玩具，是真解决干活的问题。"}],practice:"说一句话：我最烦的那件重复活是____。写在纸上，别只在脑子里想。"},{h:"怎么选场景",blocks:[{kind:"steps",title:"三步筛出来",items:["找：你（或者你身边的人）每天最烦、最重复的那件事是啥","筛：这事是不是「重复、不用动脑、按规则来」","定：能不能交给AI或工具干"]},{kind:"table",head:["能做","不做"],rows:[["每天回客户同样的问题","要你拍板定价的事"],["每月整理一次账","要你担责的决定"],["老客一个个回访、提醒","涉及隐私底线的活"],["把一堆信息整理成固定格式","只有你能凭经验判断的活"]]},{kind:"tip",title:"判断标准",text:"你能把这件事的做法「说成一条条规则」，就能做工具；说不成规则，就先别做。"}],practice:"把你选的场景，硬写出3条规则（什么情况做什么），写不出来就换一个场景。"},{h:"怎么做出一个",blocks:[{kind:"p",text:"不用会代码。老老实实按六步走，每一步都有人帮你。"},{kind:"steps",title:"六步",img:"fig-six-steps.png",items:["第一步 定场景：解决啥问题，一句话说清","第二步 画流程：AI一步步怎么干，先写下来","第三步 喂资料：把该用的产品信息、话术、价格、常用数据喂进去","第四步 组装：用现成工具搭出来，不用从零开发","第五步 测：拿真实情况试，改到能用为止","第六步 收尾：写成别人也能照着用的说明"]},{kind:"good",title:"第二步的成果长什么样",text:"拿「老客到期提醒」举例，流程写成：①读客户名单和上次来的日期 → ②算出谁快到周期了 → ③按客户类型挑一条话术 → ④生成一条能直接发的微信 → ⑤按紧急程度排序。写得出这五步，工具就成了一半。"},{kind:"bad",title:"最容易卡住的地方",text:"第三步——资料没喂够。工具干得不好，九成不是工具的问题，是你没把「它该知道的东西」给它。价格、话术、规则、例外情况，都要喂。"},{kind:"tip",title:"别怕做丑",text:"第一版能跑起来就行。你后面每一版都会比上一版好，但前提是得有第一版。"}],practice:"按第一步到第四步，把第一版搭出来。丑没关系，跑起来就算赢。"},{h:'怎么测才算"真能跑"',blocks:[{kind:"p",text:"「能跑」不是它在你面前演示得好，是你拿真数据跑出了能用的结果。"},{kind:"list",title:"测三样",items:["真数据：用你真实的客户名单、账单去跑，不用编的例子","真场景：在你真要用它的那个时间点跑，不是特意腾出一个空档","真接手：让一个没参与的人照着你的说明跑一遍，他不问你就跑通了，才算过"]},{kind:"bad",title:'不算数的三种"测过"',text:'①只跑了一遍顺顺利利的例子；②遇到不对的地方手动擦屁股，还说"基本能用"；③只有你自己会跑，别人照着说明书跑不起来。'}],practice:"找个人（家人、同事都行）照你的说明跑一遍，把他卡住的地方记下来，那就是你要改的地方。"},{h:"不用写代码，工具到底怎么搭出来",blocks:[{kind:"p",text:"你可能以为「做工具」得会编程。不用。这个阶段说的是用现成的东西组装出来。"},{kind:"list",title:"从省事到讲究，四档",items:["最省事：在现成平台上配一个智能体（扣子、腾讯元器这类），把资料喂进去、规则写清楚，就能用","再讲究点：把问法写成一个固定模板，每次只换里面的内容，效果稳得多","要连着文件、表格一起干：用能读写文件的桌面助手，一批文件一次处理完","要接你自己的系统（收银、会员、库存）：这一档交给营主团队，你不用碰"]},{kind:"good",title:"你就用能自己维护的那一档",text:"判断标准很简单：搭出来自己能改得动、坏了能自己修，才是你的工具。超出一档，你现在就接不住。"},{kind:"bad",title:"最容易跑偏的想法",text:"一上来就要「能连我店里收银系统的工具」。需求没错，但这不是第3阶段的任务，价格也不是这一档。先做最简单的那个，把「跑起来」这件事做成一次。"},{kind:"tip",title:"记住这一句",text:"这一阶段不是要做出最厉害的工具，是要做出一版真能跑的。"}],practice:"对照上面四档，写下你现在该用哪一档，以及卡在哪一档。"},{h:"怎么让工具不只是你会用",blocks:[{kind:"p",text:"工具跑起来了，还差最后一步：让它变成「别人照着也能用」。"},{kind:"steps",title:"三步",items:["先把你的做法写成一条条规则——什么情况做什么，写不出来就是还没想清","再写一份说明：谁用、什么时候用、输入什么、出错怎么办","找一个没参与过的人，照你的说明跑一遍。他不用问你就算过"]},{kind:"table",head:["写说明时必须写清","为什么"],rows:[["什么时候用它","不说清时间点，用的人永远想不起来还有这个工具"],["输入什么","不给标准输入，结果就飘，这次好用下次不好用"],["什么情况不适用","这条是保命的。不写，就会在错的场合用它"],["出错了找谁","没人知道出错怎么办，这工具用两天就废了"]]},{kind:"bad",title:"等于没写的说明",text:"「照着做就行」「很简单，你看一遍就会」——别人卡在第一步，就不会有第二步。你不是写得少，是没写。"},{kind:"tip",title:"记住这一句",text:"能交到别人手上的，才算作品；只有你自己会使的，只能算你自己的家伙什。"}],practice:"给你的工具写一份说明，然后找一个家人或同事照着跑一遍，把他卡住的地方补进说明。"},{h:"这个阶段为什么最重要",blocks:[{kind:"p",text:"你做出的这个工具，就是你的第一个作品。"},{kind:"p",text:"到第4阶段，教的就是怎么把它卖给需要的人。那时候你不用从零想案例——你手上已经有真东西了。"},{kind:"tip",title:"记住这一句",text:"这个阶段让你从「学的」变成「有作品的」。"}],practice:"把你的工具说明和跑出来的结果存到一个文件夹里。这就是你的作品集第一页。"}],checklist:["我能一句话说清我的工具解决什么问题","我把这件事写成了3条以上规则","我知道自己这一档该用哪种做法搭，不用写代码也能上手","我有第一版真能跑起来的东西（哪怕丑）","我用真实数据跑过，不是编的例子","我写了别人能照做的说明","我让一个外人照着说明跑通过"],faq:[{q:"我真的不用学编程吗？",a:"这个阶段不用。你用的是现成工具来组装。等到第4阶段接客户的单，编程那部分由营主的团队来做。"},{q:"我的工具很简单，会不会太低级？",a:"越简单越好。能解决一件真实的烦事，就值钱。花哨但没人用的，才是真低级。"},{q:"做出来跑不起来怎么办？",a:"九成是资料没喂够或者规则没写清。回头看第二步和第三步，别急着换工具。"},{q:"第一版丑，能交吗？",a:"能，只要真能跑、真解决问题。丑不是问题，跑不起来才是。"}],task:"交一个真能跑的专属工具 + 使用说明",taskDetail:"跑不起来不算过。要拿真实例子跑出结果来。",examFields:[{key:"solve",label:"我的工具解决什么",hint:"一句话说清",type:"input"},{key:"who",label:"给谁用",hint:"自己用 / 谁用",type:"input"},{key:"steps",label:"怎么用",hint:"写步骤，别人照着能跑起来",type:"textarea"},{key:"proof",label:"真跑过吗（贴结果）",hint:"拿真实例子跑出来的结果贴上来",type:"textarea"}],rubric:[{name:"工具真能跑",max:50,hint:"有真实跑出来的结果、能解决那个问题算满分；只有设想、没跑过、跑不起来得0-10分"},{name:"有别人能跟着用的说明",max:20,hint:'步骤清楚、别人照着能复现算满分；只有一句"就这样用"得0-5分'},{name:"解决了真实的活儿",max:20,hint:"对着真实的重复性活儿算满分；做成玩具、没有实际用途得0分"},{name:"说得出别人会不会愿意为它付钱",max:10,hint:"说清了谁会买、为什么买算满分；没说不得分"}]},{id:4,name:"专家团变现",price:"9999元",tagline:"帮企业/个人造团，接单赚钱",brief:"把你会的打包成服务：找客户、报价、谈需求、交付、收钱，把一条路走通。",gain:"能独立接单，手上有作品集和报价单，第一个月就能看到进账。",help:"给渠道、给报价参考、给交付模板，接到第一单之前一直陪着，卡住了随时问。",goal:"学完你能报价、接单、交付——真金白银开单。",duration:"约 85 分钟",sections:[{h:"客户为什么愿意买",blocks:[{kind:"p",text:"客户买的不是AI，是「省事、赚钱、不踩坑」。"},{kind:"list",title:"中小老板的真实处境",items:["不懂技术，也不想知道技术是什么","知道自己烦，但说不清该做什么工具","怕花冤枉钱，怕做出来没人用","要的是「能帮我省多少事、多赚多少钱」，不是技术名词"]},{kind:"tip",title:"记住这一句",text:"你不是卖AI的，是帮老板解决问题的。"},{kind:"bad",title:"最常犯的错",text:"一坐下就讲模型、讲智能体、讲架构。老板听三句就烦了。你要讲的是「你现在一天花几个小时在这个活上，做完这个工具能省掉几个小时」。"}],practice:"挑一个你认识的老板，用一句不含任何技术词的话，说清你能帮他把哪件事省掉。"},{h:"真实报价",blocks:[{kind:"p",text:"说实数，不吹牛。吹高了自己交付不了，吹低了白干。"},{kind:"table",head:["档位","交付什么","真实报价"],img:"fig-quote.png",rows:[["体验档","1个工具","2.8万起"],["标准档","2-3个工具打包（主推）","6-12万"],["进阶档","4-5个工具 + 接原有系统","12-18万"],["维护费","改东西、加功能","500-1500元/月"]]},{kind:"tip",title:"一定要提的一句",text:"维护费是长期利润。交付的时候务必提，别等客户问。"},{kind:"bad",title:"三个报错价的坑",text:"①报价只看「做多久」不看「省多少」——客户按省下的钱买单；②不敢报标准档，一上来就压到成本价——后面加需求你只能白干；③不收定金就开工——后面扯皮你没有筹码。"}],practice:"拿你第3阶段做的那个工具，按上面的档位给它定一个价，并写下你怎么跟客户解释这个价。"},{h:"接单四步",blocks:[{kind:"steps",title:"从找客户到收定金",items:["找客户：本地企业、商单平台、靠内容获客（写案例文章）","问5个问题：做什么生意 / 最烦啥 / 现在啥水平 / 一个月赚多少 / 买过什么软件","算账给他看：省多少小时 = 省多少钱，多久回本","报价 + 签合同 + 收定金"]},{kind:"good",title:"第2步那5个问题，为什么这么问",text:"问生意＝知道他的场景；问最烦啥＝找到切入点；问水平＝别做出他接不住的东西；问收入＝判断他能付多少；问买过什么＝知道他对软件的心理价位。这5个问题问完，方案基本就有形了。"},{kind:"quote",text:"铁律：不接没定金的单、不接低价单、尾款不付不交账号。"}],practice:"把5个问题写成一张纸（或备忘录），下次见客户直接用。"},{h:"第一次见面，话怎么开口",blocks:[{kind:"p",text:"见客户最发怵的是开场那三分钟。给你一套照着念都行的顺序。"},{kind:"steps",title:"五句话，一句别少",items:["破冰（聊他的生意，别聊天气）：「我看你家中午人挺多的，忙得过来吗？」","说来干啥（就一句，别铺垫）：「我在帮附近几家店做点省事的工具，今天来看看你有没有用得上的。」","问最烦的活：「你平时店里哪件事最占时间、最烦人？」","复述确认：「你说的这个是每天都要花两小时回同样的问题，对吧？」","不要钱要信息：「先别谈钱。我回去想想有没有办法，想好了再来跟你说。」"]},{kind:"good",title:"第五句为什么最要紧",text:"第一次见面就把价格摆上去，客户只会跟你砍价，而且他还没觉得这是件值得花钱的事。说一句「我回去想想」，下次你带着东西再来，价是你在定，主动权在你手里。"},{kind:"bad",title:"三句送命话",text:"①一上来讲模型、讲智能体、讲架构——老板听三句就烦了；②问「你要不要做个AI」——他心里没这个东西，只会说不要；③第一次见面就报总价——你还什么都没算给他听，等于把价签贴自己脸上。"},{kind:"quote",text:"你不是卖AI的，是帮老板解决一件具体烦事的。"},{kind:"tip",title:"见完马上记三样",text:"他说的原话、他最烦的那件活、他犹豫什么。下次见面，这三样就是你的开场。"}],practice:"找一位你认识的老板，把这五句话在心里过一遍，挑出你最难说出口的那句——那就是你要练的。"},{h:"怎么把账算给客户看",blocks:[{kind:"p",text:"这一节是最实用的技巧：不要光讲价值，要算账。"},{kind:"table",head:["这么算","举个例子"],img:"fig-payback.png",rows:[["先说现状","你现在每天花2小时回客户的重复问题"],["再算成本","一个月就是60小时，按你的人工算，等于多少钱"],["说清变化","工具上马后，这类问题几秒钟就能发出，不用一个个手打"],["给回本时间","总价除以每月省下的钱 ＝ 几个月回本"]]},{kind:"code",title:"能直接说的三句话",text:`第一句：「你这个活，现在一天占你几个小时？」
第二句：「做完之后，这个时间能压到多少，我们按一个月算笔账。」

改？改起来一分钟的事，放心交给它；改起来要半天、或者错一次就出大问题的（发给客户、对外报价、涉及合同），那就只让它打草稿，定稿你自己来。"}],musts:["它不给你保证，只给你概率。凡是「一定」「保证」的回答，都要打问号。","涉及钱、法、名额、日期的事，必须自己核一遍再用。","你说清楚程度决定了它干活的水平，这一步省不了。","第一遍永远是草稿，第二遍才是成品。"],exits:[{label:"去知识点查词（332 条大白话）",kind:"tab",to:"glossary"}]},{id:"tools",name:"AI工具",short:"什么活配什么工具",line:"同一个活，工具选对了省半天，选错了白折腾。",intro:"这一块解决「我该用哪个」。市面上的 AI 工具几百个，但你要用的其实就那五六个。选工具不看名气，看它擅不擅长你手头这件活。看完你能自己判断：一个新工具冒出来，值不值得试。",theme:{bg:"#FBF7F1",fg:"#FBF7F1",grad:"linear-gradient(135deg, #FBF7F1 0%, #FBF7F1 100%)"},blocks:[{h:"选工具只看三件事",d:"一，它能不能直接产出你要的东西（你要海报，它能不能出图；你要表，它能不能导 Excel）；二，它的活儿要不要你来回搬运（能读你上传的文件，就比让你自己复制粘贴强）；三，免费额度够不够你试完一遍。这三条对上了，就值得用。"},{h:"别拿聊天框干所有事",d:"最常见的坑：什么活都在对话框里敲。写长文要专门的写作工具，做图表要表格工具，处理图片视频要有界面的产品。聊天框适合「想清楚」和「起草」，真正做成品得用它对应的工具。"},{h:"一个工具用透，比装十个强",d:"新手最容易犯的错是天天换工具。同一个工具用它二三十次，你就知道它的脾气：哪儿会翻车、怎么说它才听话。这份手感，比多装九个工具有用得多。"},{h:"免费的够不够用",d:"起步阶段，免费的绝对够。日常写东西、查资料、整理表格，主流产品的免费额度都撑得住。只有两种时候值得付费：一是免费额度用完影响你干活了，二是你要用它做交付给客户的东西、不能有水印或次数限制。"},{h:"国内和国外工具，怎么选",d:"能用国内的先用国内的：注册方便、支付方便、中文更顺、不折腾网络。什么时候考虑国外的？你要做海外生意、要处理纯英文材料，或者要用国内还没上的能力（比如最新的视频生成）。别为了「更新」硬去用不顺手的东西。"}],musts:["按「活」找工具，不按名气找。","一个工具先用到二三十次，再考虑换。","要交付给客户的东西，先确认有没有水印和次数限制。","国内够用的就别折腾国外的。"],exits:[{label:"去 AI 宇宙翻工具库（936 条）",kind:"tab",to:"eco"}]},{id:"practice",name:"AI实操",short:"真做出东西才算数",line:"看一百篇教程，不如自己交出一份能拿得出手的成品。",intro:"这一块解决「我知道道理但做不出来」。光看没用，得真动手。下面这条路子是从零到成品的完整流程，照着走一遍，你手上就多出一件能给别人看的东西。",theme:{bg:"#FBF7F1",fg:"#FBF7F1",grad:"linear-gradient(135deg, #FBF7F1 0%, #FBF7F1 100%)"},blocks:[{h:"从零到成品的五步",d:"①先说清要什么（给谁看、什么格式、多长）；②让它出第一稿，别指望一次就对；③你挑毛病，一次说清三到五处，别挤牙膏；④让它只改这几处，别重写；⑤自己通读一遍，改掉那些「一眼就是 AI 写的」句子。"},{h:"怎么让 AI 改稿而不是重做",d:"这是新手最容易浪费时间的点。你说「再改改」，它会整篇重写，之前满意的部分也变了。正确说法是：保留第几段，只把第二段的语气改得平一点，第三段的例子换成餐饮行业的，其他不要动。把「别动什么」也说清楚，它才不乱来。"},{h:"三个今天就能做完的实操",d:"①写一条 60 秒口播稿：说清产品是什么、给谁用、解决什么、怎么买；②做一张活动海报：给它尺寸、主题、主标题、要突出的数字；③把一堆乱表格理成能看的表：让它先告诉你它理解的列名，确认了再动手。三个里挑一个，今晚就能出成品。"},{h:"做完怎么检查，三眼就够",d:"第一眼看数字：金额、日期、数量有没有错。第二眼看事实：它提到的人名、机构名、政策名对不对，拿不准的去搜一遍。第三眼看语气：有没有那种空话、排比句、莫名其妙的比喻——那是最露怯的地方，删掉就顺了。"},{h:"把好用的存下来",d:"这次用哪句话让它出对了东西，把这句话抄进备忘录。攒够十条，你就有一套自己的模板了。以后再干同一类活，直接翻出来改两个词，快得多。这一步没人替你做，但它回报最高。"}],musts:["第一稿永远是草稿，别拿它交付。","改稿要说「只改哪几处、别动哪几处」。","数字、事实、语气，交付前必看三眼。","好用的话术存下来，攒成自己的模板。"],exits:[{label:"去第2阶段：一个活出一份成品",kind:"stage",to:2},{label:"说清你的活，让它告诉你用啥",kind:"tab",to:"eco"}]},{id:"media",name:"AI新媒体",short:"流量从哪来，AI 在哪儿插手",line:"每个平台的流量入口不一样，AI 该插手的地方也不一样。这两件事搞反了，发再多也白发。",intro:"这一块解决「我用 AI 做出来的东西发到哪儿、怎么让人看见」。做内容不难，难的是让人看见。下面这套法子是跑了一千八百多篇真稿统计出来的，加上 2026 年各平台最新的规矩，全是能照着做的，不讲故事。先把流量入口搞明白，再决定 AI 在哪一步插手，顺序反了就是拿好内容喂算法，白费。",theme:{bg:"#E3A366",fg:"#E3A366",grad:"linear-gradient(135deg, #E3A366 0%, #E3A366 100%)"},table:{head:["平台","流量靠什么","AI 插手这儿","别指望它"],rows:[["抖音","推荐流为主，搜索越来越管用","选题、口播稿、标题、封面大字","替你猜算法、保证上热门"],["小红书","搜索 + 发现页，看互动深度","标题、正文关键词、图片文案","写出像真人发的语气（得你改）"],["视频号","朋友转发先启动，再进公域","口播稿、字幕、封面","冷启动，得靠人先转起来"],["公众号","推荐流 + 搜一搜 + 转发","长文结构、标题、排版、摘要","涨粉，它只能帮你留住人"],["B站","搜索长尾 + 推荐，内容活得久","标题、简介、分镜、字幕","视频本身的质量"],["知乎","搜索长尾，一篇能吃很久","回答框架、资料整理、查证","原样复制（平台会识别）"],["快手","熟人关系 + 推荐，垂直深耕更值","脚本、评论回复话术","调性，得你自己拿捏"],["头条/百家","纯推荐流，靠走量","批量改写、多版本标题","高单价，单价本来就低"]]},table2:{title:"数据别只看播放量：五个信号",head:["看什么","怎么算","说明什么","你怎么用"],rows:[["点赞率","点赞 ÷ 播放","过 3% 是戳中情绪，过 5% 是爆款","找它戳的是哪一种情绪"],["评论率","评论 ÷ 播放","过 0.5% 说明有争议","争议点就是能正反两面讲的地方"],["收藏率","收藏 ÷ 播放","过 2% 说明是干货","做成避坑步骤、能反复用的清单"],["赞评比","点赞 ÷ 评论","低于 20 争议极大","立场要站稳，骂现象不骂人"],["收藏比点赞多","收藏 ÷ 点赞","工具型内容","直接做「教你三步查清楚」"]]},blocks:[{h:"先分清三种流量入口",d:"所有的流量就三种。推荐流量是平台推给你，靠前几秒留住人和后面的互动，抖音快手头条走这路子。搜索流量是用户自己搜，靠标题和正文里有没有他会搜的词，小红书 B站 知乎走这路子。私域流量是你自己的人，靠转发和社群，视频号公众号走这路子。做之前先想清楚你要哪一种：要推荐流量就在前三秒下功夫，要搜索流量就老老实实埋关键词，要私域就得先有一批愿意帮你转的人。三种都想要，往往一种都拿不到。"},{h:"2026 年各平台算法改成啥样了",d:"抖音不再只看完播率了，收藏、回头看、追更这些长期行为更值钱，一条视频的推流周期也从一天拉长到七到十五天，发完没动静别急着删。小红书算的是互动深度，评论、转发、关注的分量远高于点赞，正文最好写到六百字以上，原创度也得够。视频号是先私域后公域，朋友点赞的分量在涨，能不能有人先帮你转一把，基本决定后面有没有量。公众号这两年也在做推荐，标题清楚、主题明确、真人真事的内容更容易被推出去。B站 2026 年换了推荐算法，老套路不好使了。总的方向就一句话：平台都在拉长考核周期，靠开头套路骗停留的内容越来越难混。"},{h:"发之前先勾一下：AI 内容得亮明身份",d:"这条是硬规矩，不是建议。《人工智能生成合成内容标识办法》已经落地，用 AI 生成的文字、图片、视频都得让人看得出是 AI 做的。短视频平台还加了必选标签，发布的时候得自己勾一项，选项里有含 AI 生成内容、含虚构演绎内容、含营销信息、内容为转载、内容为个人观点、无需标注。该勾不勾的，平台会限流、下架，严重的封号。所以流程里加一步：发之前想清楚这条里 AI 参与了多少，老老实实标上。标了不掉价，被人认出来才掉价。"},{h:"一条内容的流水线，AI 在哪一步",d:"选题，AI 列二十个方向你来挑；脚本，AI 出初稿你改成口语；拍摄，这步它替不了；剪辑，剪映这类工具自动上字幕、自动卡点；封面，AI 出文案你来排版；标题，AI 一次给十个版本你挑一个；发布，时间你自己定；复盘，把后台数据截图给它，问它哪条为什么好。八步里 AI 能干六步，但挑和定永远是你的活。"},{h:"平台 × 工具：直接照着配",d:"要写稿，豆包、Kimi、通义，长文用 Kimi，口语用豆包。要做图，即梦、可灵、Midjourney，封面图用即梦最省事。要做视频，剪映管剪辑和字幕，可灵生成片段，腾讯智影做数字人播报。要找选题，去对应平台搜你那个行业的词，把前二十条标题丢给 AI，让它总结套路。要分析数据，把后台数据截图给它，问它哪条为什么好。"},{h:"爆点是咋爆的：四个要素",d:"别看播放量就下结论，先看这条凭什么留住人。四个要素：冲突，谁跟谁顶上了，老板和员工、父母和子女、加盟商和被割的，没冲突就没有爆点；利益，观众听完能拿到什么，省钱、避坑、少走三年弯路，得具体到动作；身份代入，观众凭什么觉得说的就是他，中年、上有老下有小、攒了点钱想翻身；悬念反转，前三秒抛什么，结果先说、常识反着说、身份反差。四项里填不满两项的，直接扔掉，别硬凑。"},{h:"热点变成你能讲的角度：三步",d:"热榜上的词是宏大话题，你照着念没人听。要转三道手。第一步降维，把大事落到一个人身上，月饼回收价一吨八百，变成一个开小超市的中年男人，中秋过后那一堆卖不动的礼盒。第二步换立场，永远站掏钱那个人，谁出钱、谁担风险、谁没人帮，就站谁。第三步给出口，不能停在吐槽上，要么给一句这事该咋办，要么给一句让人想开点的实在话。三步走完，这条才算是你的。"},{h:"哪些热点值得跟，哪些直接扔",d:"值得跟的，三条里至少中一条：跟钱有关、跟中年人的身份有关、跟公平有关。直接扔的：明星八卦、纯娱乐、游戏、颜值、萌宠；需要点名当事人或者给案件定性的事故和舆情；数字来源不明的，热榜词条本身不给数字，别自己编，要数字就从原视频里取，注明是人家视频里说的；跟中年人无关的校园、追星、二次元。国际大事也不是不能碰，但得能落到中国普通人的钱袋子上。"},{h:"选题怎么定：三问加一个画面检验",d:"选题不是主题，选题是某个人在某个时刻碰上的具体麻烦。如何自我提升这种不是选题，四十五岁被裁、不敢跟家里说、每天照样出门上班的人怎么开口跟老婆谈这三个月，这才是。每个选题答三问：帮谁，得具体到年龄身份处境；解决什么，得是一个能动手做的动作，不是一种感觉；给什么价值，一条判断标准、一句话术、一个避坑动作、一个算账方法。最后过一遍画面检验：能不能拍成一个具体画面，有谁、在哪、在干嘛、卡在哪一步。想不出画面的就是不合格。"},{h:"从别人的爆款里出题：三条路",d:"看到别人的爆款别照抄，改三条路。换人群，他讲年轻人副业，你改成四十五岁工厂师傅下班后能干的副业。换立场，他讲怎么加盟，你改成怎么判断这加盟是不是冲着你的加盟费来的。换落地，他讲道理，你改成给一句今晚就能用上的话术。还有个硬要求：改出来得跟原爆款不在同一层。人家讲的是现象，你给出路；人家讲的是观点，你给方法。"},{h:"一条内容的骨架：四段怎么分",d:"提出问题占一成五，把场景立住让人对号入座，一个具体的人、一个具体的卡点。解释原因占三成，说清为什么会这样、谁在里头得利，落到机制上，别落到人性这种空词上。给出方法占三成五，这部分最值钱，能当场用的动作、话术、判断标准，带数字、带顺序、带条件，先给判断标准再给动作，最后给兜底。展示结果占一成五，用了会怎样、不用的代价是什么，给画面不给承诺。收尾一成，一句人话道理加签名，不总结不喊口号。段落里不许一段塞两件事，干货要层层递进，别把最狠的一句留到最后当悬念。"},{h:"开头三行怎么写：四种钩子",d:"反差：他四十五岁被裁，第二天照常七点出门，在公园坐到下班点。结果前置：这二十万，三个月归零，不是亏在生意上，是亏在签字那一下。冲突：老婆说先别告诉孩子，他说纸包不住火，俩人在厨房吵到半夜。认知误区：加盟费越低的品牌越安全，这话害的人最多。四种任选一种，但有三条硬要求：第一句就进场景，不许写最近、今天咱们聊聊；前三行内点明这条跟谁有关，直接点人群，家里有老人的、手上有二十万的、刚被通知优化的；删掉无效寒暄和故意吓唬人的句子。"},{h:"一眼就露馅的 AI 味：这些词别写",d:"平台不推、用户也划走，多半是这几个毛病。一是空话，赋能、闭环、抓手、底层逻辑、长期主义、护城河，看到就删。二是套话，首先其次最后、综上所述、值得注意、本质上、说句不好听的、别不信。三是排比，三段一模一样的句式，每段还一样长，一看就是机器写的。四是莫名其妙的比喻和空泛金句，真正的成长是啥啥啥、时间会给你答案，全删。五是结尾把前面再概括一遍。怎么改：把抽象的换成具体的，令人担忧改成搁我身上我睡不着，提升效率改成快了两个小时、少雇一个人。写完自己读一遍，喘不过气的地方就是有问题的地方。"},{h:"一条内容变五条：一鱼多吃",d:"别一条内容只发一个平台。一篇长文能拆成口播稿，口播稿改成小红书图文，图文里的要点改成朋友圈文案，长视频里剪出三条短的，短的再攒成一篇合集。同一份料换五种形态发五个地方，成本几乎为零。顺序也有讲究：先做最重的那个，长文或者长视频，再做轻的，反过来你会发现轻的内容撑不起重的。"},{h:"一个人怎么撑起一个号",d:"别想着日更。一周两到三条就够。周日用 AI 列二十个方向，挑出三个；周一到周三每天做一条，脚本两小时、拍剪两小时；周四发，看数据；周五照着数据最好的那条，让 AI 再生成三个同类选题。一周算下来七八个小时，一个人扛得住，还能一直做下去。"}],musts:["先分清要哪种流量：推荐、搜索、私域，别三种都要。","2026 年起 AI 生成内容必须标注，不标会限流甚至封号。","热点三条里至少中一条：跟钱有关、跟身份有关、跟公平有关。","四要素填不满两项的选题，直接扔，别硬凑。","点赞率过 3% 是戳中情绪，收藏率过 2% 是干货。","别停在吐槽上，一定要给出口。","写完自己读一遍，喘不过气的地方就是 AI 味。","发十条看一次数据，照着好的再做十条。"],exits:[{label:"去 AI 宇宙挑工具（936 条）",kind:"tab",to:"eco"},{label:"去 AI实操：把一条内容做出来",kind:"section",to:"practice"},{label:"去 AI陪跑：卡住了有人接",kind:"section",to:"run"}]},{id:"run",name:"AI陪跑",short:"卡住了有人接着",line:"学东西最怕卡在第三步没人管。我们就是来接着你的。",intro:"这一块讲清楚「陪跑到底是干什么的」。不是替你干，是不让你卡住——你动手，卡了随时问，我们在旁边接着。学习是反人性的，所以我们尽量把「学」换成「一起把活干完」。",theme:{bg:"#F3E4D2",fg:"#F3E4D2",grad:"linear-gradient(135deg, #F3E4D2 0%, #F3E4D2 100%)"},blocks:[{h:"我们具体帮你做什么",d:"三件事。给模板：每个活都配好现成的问法和格式，你改两个词就能用。改成品：你做出来的东西，我们帮你看哪儿不对、改到能交付的程度。盯进度：你三天没动，我们会问一句，不是催你，是怕你放弃。"},{h:"什么时候该来找我们",d:"四种情况别自己硬扛：①不知道怎么开头，盯着屏幕十分钟没打出一个字；②它给的答案明显不对但你不知道哪不对；③做完了但不确定能不能拿给客户；④做着做着觉得没意思、想放弃。这四种，来问，比自己憋两小时快。"},{h:"怎么问，才有人真能帮上",d:"问的时候带上三样：你要干什么活、你现在做到哪一步了、卡在哪。别只发一句「这个怎么弄」——那种问题谁也没法接。把这三样说全，我们看一眼就知道你缺哪块。"},{h:"陪跑到什么程度算完",d:"标准很具体：你手上有一件能拿给别人看的东西。不是「我学会了」，是「我做出这个了」。一条口播稿、一张海报、一份整理好的表、一个能跑起来的小工具——有这个，这一程就算走完。"},{h:"我们不承诺什么",d:"不承诺暴富，不承诺几节课就月入过万，不承诺你什么都不用干。交付物和标准都摆在明面上，能做到就是能做到。钱的事只讲真能落地的路子，讲不清的一律不说。"}],musts:["陪跑不是替你干，是让你卡住的时候有人接。","提问带三样：什么活、做到哪、卡在哪。","走完一程的标志：手上有件能拿得出手的东西。","不承诺暴富。"],exits:[{label:"直接问：把你的情况说清楚",kind:"consult"},{label:"看看陪跑团里都有谁",kind:"coach"}]},{id:"money",name:"AI赚钱",short:"先有东西，再谈卖",line:"赚不到钱的常见原因不是不会 AI，是手上没有能卖的东西。",intro:"这一块只讲能落地的变现路子，讲不清的不写。前提是先做出东西——空着手谈变现，等于还没学会走就想跑。看完你能判断自己现在该走哪条路、第一单从哪来。",theme:{bg:"#FBE4DF",fg:"#FBE4DF",grad:"linear-gradient(135deg, #FBE4DF 0%, #FBE4DF 100%)"},blocks:[{h:"三条最实在的路（按上手难度排）",d:"①接单干活：帮人写文案、做图、整理资料、做表格，一单一结，来钱最快，天花板也最低。②做工具卖：把你反复干的那件活做成小工具，卖一次做一次，能重复卖。③做内容：把你会的讲出来，靠流量或社群变现，最慢但最持久。建议从①起步，边接单边攒②。"},{h:"第一单从哪来",d:"别一上来就投广告。第一个客户九成来自你已经认识的人：以前的同事、同学、常去的店老板、小区的兴趣群。直接说你能干什么、多少钱、多久给。先做成一单不赚钱的也行——你要的是「案例」和「交付一次的经验」，这两样比钱值钱。"},{h:"报价怎么开口",d:"新手别按小时报，按「件」报。先想清楚这件事做完要花你几个小时，乘一个你自己能接受的时薪，再往上加三成（因为一定会返工）。第一次报低点没关系，但要写清楚包含几次修改——不然改十遍的钱也是你出。"},{h:"最容易踩的四个坑",d:"①接了自己干不了的活，最后交不出来；②没写清楚改几次，被无限返工；③先干活后收钱，尾款要不回来；④把 AI 出的东西直接交出去，被客户一眼看穿。这四条,踩一条就够难受半年。"},{h:"什么时候才算真跑通",d:"标准是：有一个不是你朋友的陌生人，为你的东西付了钱，而且你还愿意再接一单。到这一步，说明你的路子成立，接下来只是放大。在那之前，别急着买课、别急着招人、别急着做品牌。"}],musts:["先有能卖的东西，再谈卖。","按件报价，写清包含几次修改。","第一单从认识的人里来，先换案例。","定金后开工，尾款交付前结。"],exits:[{label:"去第4阶段：把一条路走通",kind:"stage",to:4}]}],cd=[{id:"run",name:"智能陪跑团入口",line:"卡住了有人接，不用自己硬扛",theme:{bg:"#F3E4D2",fg:"#F3E4D2",grad:"linear-gradient(135deg, #F3E4D2 0%, #F3E4D2 100%)"},sectionId:"run"},{id:"ask",name:"卡点体检入口",line:"点四道题，直接给你能用的工具和下一步",theme:{bg:"#E3A366",fg:"#E3A366",grad:"linear-gradient(135deg, #E3A366 0%, #E3A366 100%)"},sectionId:"ask"}],fs={id:"ask",name:"在线答疑",short:"不知道从哪下手，先问一句",line:"别自己对着屏幕猜。把你的情况说清楚，我们告诉你从哪一步开始。",intro:"这一块解决「我完全不知道该怎么开始」。你不需要先懂 AI，也不需要想清楚要学什么——你只要说清楚你手上有件什么活、卡在哪儿，我们给你指第一步。",theme:{bg:"#E3A366",fg:"#E3A366",grad:"linear-gradient(135deg, #E3A366 0%, #E3A366 100%)"},blocks:[{h:"先别问「我该学什么」",d:"这个问题太难答，因为没有标准答案。换个问法，问「我这件活怎么用 AI 干掉」，就好答多了，而且答完立刻能用上。"},{h:"照着这个格式写，一次就能问对",d:"我是干什么的（一句话）｜我手上最烦、最花时间的一件活是什么｜这件事我现在是怎么干的、卡在哪一步｜我希望能省掉多少时间。四句话写全，我们看完就知道该给你什么。"},{h:"你会拿到什么",d:"一条明确的起步动作——不是一堆课，是「今天回去先做这一件事」。做完再来问下一步。一次一小步，比一次听三小时管用。"},{h:"找我们的方式",d:"在训练营群里 @ 陪跑团，或者直接在我们的企业微信里发。不用打招呼，把上面那四句话贴过去就行，我们看得懂。"}],musts:["别问「我该学什么」，问「我这件活怎么干掉」。","四句话写全：干什么的、烦什么活、卡在哪、想省多少时间。","一次拿一个动作，做完再来。"],exits:[{label:"现在就问一句",kind:"consult"},{label:"看看陪跑团里都有谁",kind:"coach"}]};function dd(t){for(var e=0;e<At.length;e+=1)if(At[e].id===t)return At[e];return t==="ask"?fs:null}r(dd,"getSecti penAI 的代码智能体，能自己读代码库、改代码、跑测试，是现在「AI 写代码」这条线的代表产品。"},{name:"Windsurf",sub:"Windsurf",cat:"编程",desc:"另一款主流的 AI 代码编辑器，主打「让 AI 顺着你的思路一路做完」，和 Cursor 是直接竞品。"},{name:"扣子 Coze",sub:"字节跳动",cat:"开发平台",desc:"拖拖拽拽就能搭一个自己的机器人：接插件、连知识库、编工作流，搭完一键发布到飞书、微信、抖音。上手快，是国内用得最多的低代码智能体平台之一。"},{name:"腾讯元器",sub:"腾讯",cat:"开发平台",desc:"腾讯的智能体平台，低代码搭完能直接接到公众号、小程序、企业微信里。你的客户就在微信上的话，选它最顺。"},{name:"文心智能体平台",sub:"百度",cat:"开发平台",desc:"百度做智能体的平台，用说话的方式就能配出一个会查资料、会调工具的智能体，能接企业自己的知识库。"},{name:"阿里云百炼",sub:"阿里巴巴",cat:"开发平台",desc:"阿里云的大模型应用平台，有现成的智能体模板可以改，适合已经有阿里云账号的团队。"},{name:"讯飞星辰",sub:"科大讯飞",cat:"开发平台",desc:"讯飞的智能体平台，教育、医疗、政务有现成模板，语音交互是它最特别的地方。"},{name:"360 智语",sub:"360",cat:"开发平台",desc:"360 的企业级智能体平台，主打数据安全和合规，适合对安全要求高的单位。"},{name:"Dify",sub:"开源项目",cat:"开发平台",desc:"开源的大模型应用开发平台。能自己部署、数据不出门，适合对数据安全有要求的团队。"},{name:"n8n",sub:"开源项目",cat:"开发平台",desc:"开源的工作流自动化工具，能把 AI 模型和几百种软件接在一起，做「到点自动干活」的流程。"},{name:"Coze Studio",sub:"开源项目",cat:"开发平台",desc:"扣子开源出来的版本，可以自己部署一套，数据放在自己服务器上。"},{name:"DeepSeek Harness",sub:"深度求索",cat:"开发平台",desc:"深度求索的智能体运行框架。模型负责「想」，Harness 负责模型之外那一整套调度和工具调用——业内常说的「Agent = 模型 + Harness」。"},{name:"NVIDIA CUDA",sub:"NVIDIA",cat:"开发平台",desc:"让程序能调用显卡算力的那套底层工具。几乎所有大模型训推都得过它这一关，所以 NVIDIA 不光卖芯片，还握着整个生态。"},{name:"NVIDIA NIM",sub:"NVIDIA",cat:"开发平台",desc:"NVIDIA 把常用模型打包成「开箱即用」的服务接口，企业不必自己从头部署，直接拿来接业务。"},{name:"MegEngine 天元",sub:"旷视科技",cat:"开发平台",desc:"旷视自研并开源的深度学习框架，训练和推理都能做。国内最早一批自己写框架的团队之一，现在代码是公开的。"},{name:"第四范式 SageOne",sub:"第四范式",cat:"开发平台",desc:"卖给企业用的 AI 平台，从准备数据、自动建模到上线监控走完整条流程。主打让不懂算法的人也能训出能用的模型。"},{name:"Suno",sub:"Suno",cat:"生活娱乐",desc:"AI 写歌唱歌的工具，给一段词就能生成一整首歌，做短视频背景音乐很方便。"},{name:"海绵音乐",sub:"字节跳动",cat:"生活娱乐",desc:"字节做的 AI 音乐工具，中文歌的咬字和风格比海外产品自然。"},{name:"猫箱",sub:"字节跳动",cat:"生活娱乐",desc:"AI 角色扮演对话产品，能跟虚拟角色聊天，年轻人用来解闷的多。"},{name:"星野",sub:"稀宇科技",cat:"生活娱乐",desc:"MiniMax 旗下的 AI 角色扮演产品，同一类玩法的另一个选择。"},{name:"Hermes",sub:"生态库收录",cat:"小工具",desc:"生态库里收录的 AI 小工具。这类工具通常只解决一个很窄的问题，用得着再装。"}],Gd=[{name:"DeepSeek V4",sub:"深度求索",cat:"国产开源",tags:["语言 · 推理","稀疏","百万上下文"],desc:"把原来「通用」和「推理」两条产品线合成一个模型，让它按任务难度自己决定要想多久。百万 Token 上下文，MIT 协议可以商用，价格是它最出名的标签。"},{name:"DeepSeek V3.2 / V3.2-Exp",sub:"深度求索",cat:"国产开源",tags:["语言","稀疏","6850亿"],desc:"V3 系列的新版本，实验版（Exp）把 API 价格直接砍了一半——对做应用的人来说，这就是同样一笔钱能干两倍的活。"},{name:"智谱 GLM-4.6 / GLM-5.2",sub:"智谱AI",cat:"国产开源",tags:["语言 · 编程","稀疏","7530亿级"],desc:"GLM 的主力版本，MIT 协议。主打长链条编程和自动跑任务，已经能在国产芯片（寒武纪）上跑起来。"},{name:"Kimi K3",sub:"月之暗面",cat:"国产开源",tags:["语言 · 长文本","稀疏","2.8万亿"],desc:"2.8 万亿参数的混合专家模型，是当时最大的开源权重模型，百万 Token 上下文。特长是长任务不跑偏——任务链条拉很长也还记得住。"},{name:"通义千问 Qwen 3.8 / Qwen3-VL",sub:"阿里巴巴",cat:"国产开源",tags:["语言 · 多模态","稠密 + 稀疏","尺寸齐全"],desc:"全世界下载量最大的开源模型家族，小尺寸版本多、协议宽松（Apache-2.0），最容易自己部署。Qwen3-VL 是它的视觉版本，能看图、看视频、读文档里的图表。"},{name:"混元 Hy4",sub:"腾讯",cat:"国产开源",tags:["语言 · 多模态","稀疏","7700亿"],desc:"腾讯自研的混合专家模型，每次激活约 490 亿，百万 Token 上下文，协议宽松。图像、3D、视频生成也比一般模型强。"},{name:"混元图像 3.0",sub:"腾讯",cat:"国产开源",tags:["图像","稀疏","800亿"],desc:"专门做图的模型，中文语义理解好，出海报、配图这类活用它。"},{name:"混元 3D 3.0",sub:"腾讯",cat:"国产开源",tags:["3D","稀疏"],desc:"做 3D 模型的生成模型。想做商品 3D 展示、游戏素材，这类能力现在一句话就能出。"},{name:"混元角色扮演",sub:"腾讯",cat:"国产开源",tags:["语言","稀疏","角色扮演"],desc:"专门调过「演角色」这一个方向的模型，适合做陪聊、虚拟客服、剧情互动类产品。"},{name:"MiniMax M3",sub:"稀宇科技",cat:"国产开源",tags:["语言 · 长文本","稀疏注意力","百万上下文"],desc:"用稀疏注意力设计，在百万 Token 的超长上下文下还能把算力成本压住。长文档和多种格式的输入是它的主场。"},{name:"百川 Baichuan",sub:"百川智能",cat:"国产开源",tags:["语言","稠密","医疗方向"],desc:"王小川创办的百川智能做的模型，重点在医疗和行业应用。"},{name:"零一万物 Yi",sub:"零一万物",cat:"国产开源",tags:["语言","稠密"],desc:"李开复创办的零一万物做的开源模型系列，早期在中英双语上表现不错。"},{name:"阶跃 Step",sub:"阶跃星辰",cat:"国产开源",tags:["多模态","稠密 + 稀疏"],desc:"阶跃星辰的模型系列，走多模态路线，图像、语音、视频都能处理。"},{name:"天工 Skywork",sub:"昆仑万维",cat:"国产开源",tags:["语言","稠密","搜索增强"],desc:"昆仑万维的模型系列，主打搜索增强和内容生成。"},{name:"MiniCPM",sub:"面壁智能",cat:"国产开源",tags:["语言 · 端侧","稠密","小尺寸"],desc:"面壁智能做的小尺寸模型，特点是「小但够用」，能在手机和端侧设备上跑。"},{name:"日日新",sub:"商汤科技",cat:"国产开源",tags:["多模态","稀疏"],desc:"商汤的大模型系列，多模态和行业落地是它的方向。"},{name:"豆包 1.6 / Seed 2.1 Pro",sub:"字节跳动",cat:"国产闭源",tags:["多模态","稀疏","2万亿"],desc:"字节的旗舰通用模型，图片、音频、视觉语言都能一起处理，主打便宜、稳、多模态好。不开源，主要走自家 API。"},{name:"文心大模型 5.0",sub:"百度",cat:"国产闭源",tags:["原生全模态","稀疏","2.4万亿"],desc:"百度的思考型旗舰模型，原生全模态——文字、图片、语音、视频从底层就一起处理，背后是百度搜索。"},{name:"讯飞星火 X1.1 / V4.5",sub:"科大讯飞",cat:"国产闭源",tags:["语言 · 语音","稠密","教育医疗"],desc:"讯飞的模型，语音识别和语音合成是国产第一梯队，中小学数理化适配度也高。"},{name:"通义千问 Qwen-Max",sub:"阿里巴巴",cat:"国产闭源",tags:["语言 · 多模态","稀疏","旗舰档"],desc:"通义家族里最顶的那一档，不开源。复杂数据分析、批量办公、多语言任务用它。"},{name:"可灵 2.5 Turbo",sub:"快手",cat:"国产闭源",tags:["视频","稠密"],desc:"快手可灵的视频生成模型新版本，主打更快、更便宜，适合批量做视频素材。"},{name:"360 智脑",sub:"360",cat:"国产闭源",tags:["语言","稠密","安全方向"],desc:"360 的模型，主打安全场景，和政府、金融这类对合规要求高的地方结合。"},{name:"云从从容",sub:"云从科技",cat:"国产闭源",tags:["语言 · 多模态","稠密","行业方向"],desc:"云从的大模型，主打「人机协同」这套说法，落在政务、金融这类要跟人配合的场景里，不面向普通聊天用户。"},{name:"华为盘古",sub:"华为",cat:"国产闭源",tags:["语言 · 多模态","稠密","行业方向"],desc:"华为的大模型系列，分语言、视觉、气象、矿山好几个版本。重点不在陪人聊天，而是塞进政务、工业这些行业里干活，跟昇腾芯片是一整套。"},{name:"GPT-5 / GPT-5.5",sub:"OpenAI",cat:"海外闭源",tags:["语言 · 多模态","稀疏","旗舰"],desc:"OpenAI 的旗舰模型，综合能力还是很能打。不开源，只能通过 API 或 ChatGPT 用。"},{name:"Claude Opus / Sonnet 4.5",sub:"Anthropic",cat:"海外闭源",tags:["语言 · 编程","稠密","长文写作"],desc:"Anthropic 的模型系列。写长文、写代码特别稳，很多开发者日常主力就是它。"},{name:"Gemini 3",sub:"Google",cat:"海外闭源",tags:["原生多模态","稀疏","超长上下文"],desc:"谷歌的旗舰模型，图片、视频、音频一起理解是它的强项，上下文窗口也很大。"},{name:"Sora 2 / Sora 2 Pro",sub:"OpenAI",cat:"海外闭源",tags:["视频","稀疏"],desc:"OpenAI 的视频生成模型，画面和一致性又提了一档，做短视频素材的人可以留意。"},{name:"Grok",sub:"xAI",cat:"海外闭源",tags:["语言","稀疏","接实时信息"],desc:"马斯克旗下 xAI 的模型，特点是能接到社交平台上的实时信息。"},{name:"Mistral Large",sub:"Mistral AI",cat:"海外闭源",tags:["语言","稠密","欧洲"],desc:"法国 Mistral 的旗舰模型，欧洲市场用得比较多，同时也有几个开源版本。"},{name:"Cohere Command",sub:"Cohere",cat:"海外闭源",tags:["语言","稠密","企业方向"],desc:"加拿大 Cohere 的模型，很少面向个人用户，主要卖给企业做检索、摘要、客服。特点是不追热度，稳当。"},{name:"Llama",sub:"Meta",cat:"海外开源",tags:["语言","稠密","开源生态底座"],desc:"Meta 的开源模型系列，是海外开源生态里用得最广的底座。不过有消息说下一代可能转向闭源，值得留意。"},{name:"Gemma",sub:"Google",cat:"海外开源",tags:["语言 · 端侧","稠密","小尺寸"],desc:"谷歌放出来的开源小模型系列，体积小、好部署，适合在本地或端侧跑。"},{name:"Phi",sub:"Microsoft",cat:"海外开源",tags:["语言","稠密","小尺寸"],desc:"微软做的小尺寸开源模型，主打「小体积也能有不错的推理能力」。"},{name:"Stable Diffusion",sub:"Stability AI",cat:"海外开源",tags:["图像","扩散"],desc:"开源图像生成里名气最大的一个，能装在自己电脑上跑，改风格、改细节全看你怎么写提示词。现在有 SDXL 等好几代版本。"}],Bd=[{name:"NVIDIA H100 / H200",sub:"NVIDIA",cat:"AI芯片",desc:"训练大模型最主流的加速卡。国内拿货不容易，价格也高，但生态（CUDA）没人能替。"},{name:"NVIDIA GB200",sub:"NVIDIA",cat:"AI芯片",desc:"英伟达的新一代方案，把芯片成组打包成一个机柜级系统，专门训超大模型。"},{name:"NVIDIA B200",sub:"NVIDIA",cat:"AI芯片",desc:"英伟达新一代旗舰加速卡，算力和显存都比 H100 高一个台阶。"},{name:"华为昇腾 910B / 910C",sub:"华为",cat:"AI芯片",desc:"国产训练卡里用得最多的一个，配套的 CANN 生态这几年成熟得比较快。"},{name:"壁仞 BR100",sub:"壁仞科技",cat:"AI芯片",desc:"国产通用 GPU 芯片，训练和推理都能用。"},{name:"天数智芯 天垓300",sub:"天数智芯",cat:"AI芯片",desc:"国产 AI 训练芯片。"},{name:"寒武纪 思元690",sub:"寒武纪",cat:"AI芯片",desc:"国产 AI 芯片，训练和推理两条线都有布局，国产模型已经能跑在上面。"},{name:"摩尔线程 MTT S5000",sub:"摩尔线程",cat:"AI芯片",desc:"国产通用 GPU，图形和计算都想兼顾。"},{name:"昆仑芯 P800 / R300",sub:"昆仑芯",cat:"AI芯片",desc:"百度体系的 AI 芯片，主要给自己的云和模型用。"},{name:"沐曦 曦云 C600",sub:"沐曦",cat:"AI芯片",desc:"国产 GPGPU 芯片。"},{name:"海光 DCU 深算系列",sub:"海光",cat:"AI芯片",desc:"国产加速卡，生态上尽量兼容主流的开发方式，迁移成本低一些。"},{name:"燧原 邃思 L600",sub:"燧原科技",cat:"AI芯片",desc:"国产 AI 训练芯片。"},{name:"Google TPU",sub:"Google",cat:"AI芯片",desc:"谷歌自研的 AI 芯片，不外卖，只在自己云上用。Gemini 就靠它训。"},{name:"AMD MI300X / MI350",sub:"AMD",cat:"AI芯片",desc:"英伟达之外最主流的替代选择，显存大，价格有竞争力。"},{name:"Apple M 系列芯片",sub:"Apple",cat:"AI芯片",desc:"苹果电脑里的芯片，统一内存设计让它能在本地跑中等规模的模型。"},{name:"NVIDIA DGX H100",sub:"NVIDIA",cat:"训练服务器",desc:"英伟达的 AI 训练服务器整机。数据中心里训大模型的主力装备。"},{name:"华为 Atlas 800 训练服务器",sub:"华为",cat:"训练服务器",desc:"基于昇腾芯片的训练服务器整机，国产算力方案里的主力。"},{name:"浪潮 AI 服务器",sub:"浪潮信息",cat:"训练服务器",desc:"国内服务器大厂做的 AI 服务器，很多智算中心都用它。"},{name:"阿里云灵骏智算集群",sub:"阿里巴巴",cat:"训练服务器",desc:"阿里云的智算集群服务，租算力训模型，不用自己买机器。"},{name:"华为 Mate 60 Pro",sub:"华为",cat:"终端设备",desc:"华为旗舰手机。端侧跑小模型、手机上直接调 AI 能力的代表机型。"},{name:"小米 15",sub:"小米",cat:"终端设备",desc:"小米旗舰手机，搭载端侧的 MiMo AI 助手。"},{name:"科大讯飞 AI 学习机",sub:"科大讯飞",cat:"智能终端",desc:"面向学生的 AI 学习设备，主打语音交互和学科辅导。"},{name:"Apple Vision Pro",sub:"Apple",cat:"智能终端",desc:"苹果的空间计算头显，把屏幕「搬」到现实空间里。"},{name:"宇树 人形机器人",sub:"宇树科技",cat:"智能终端",desc:"国产四足和人形机器人，是「具身智能」（AI 有了身体）这条线的代表。"},
