<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 创业赚钱 100 种方法 · 海大叔商业智脑</title>
<meta name="description" content="AI 创业赚钱一百种方法：10 大类 100 条路子，每条写清怎么做、要什么门槛、第一笔钱从哪来、最容易栽的坑。普通人用 AI 挣钱的可执行清单。">
<link rel="canonical" href="https://haidashu.com.cn/zhinao/aimoney/">
<style>
:root{--bg:#0d0f12;--card:#15181d;--line:#242932;--txt:#e8eaed;--dim:#9aa3ae;--acc:#c9a227}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.75}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{padding:44px 0 24px;border-bottom:1px solid var(--line)}
.eyebrow{display:inline-block;font-size:12.5px;letter-spacing:.12em;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 12px;margin-bottom:16px}
h1{font-size:30px;margin:0 0 12px;line-height:1.35}
.lead{color:var(--dim);font-size:15px;margin:0 0 6px}
.note{color:var(--dim);font-size:13px;margin-top:10px}
.bar{position:sticky;top:0;z-index:9;background:rgba(13,15,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.bar-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 220px;min-width:180px;background:#0a0c0f;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
.chip{background:#1b1f26;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#141414;font-weight:700}
.sec{margin:34px 0 6px}
.sec h2{font-size:19px;margin:0 0 4px}
.sec p{color:var(--dim);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.card h3{font-size:15.5px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.no{color:var(--acc);font-size:12.5px;font-weight:700;flex:0 0 auto}
.row{font-size:13.5px;color:#cfd5dd;margin:3px 0}
.k{color:var(--dim);font-size:12.5px;margin-right:4px}
.pit{color:#e0b980}
footer{margin:48px 0 60px;padding-top:22px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
.btn{display:inline-block;margin-top:14px;background:var(--acc);color:#141414;font-weight:700;border-radius:10px;padding:10px 18px;font-size:14px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);margin-left:8px}
@media(max-width:520px){h1{font-size:23px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">海大叔商业智脑 · 方法库</span>
    <h1>AI 创业赚钱 100 种方法</h1>
    <p class="lead">10 大类、100 条路子。每条写清：怎么做、要什么门槛、第一笔钱从哪来、最容易栽的坑。</p>
    <p class="note">不承诺收益，只讲路径。挑一条能今天就动手的，比看完 100 条有用。</p>
    <a class="btn" href="/zhinao/">回智脑问一句 →</a><a class="btn ghost" href="#all">直接看 100 条</a>
  </div>
</header>

<div class="bar">
  <div class="wrap bar-in">
    <input id="kw" type="search" placeholder="搜关键词，比如 口播、接单、模板、本地、出海…">
    <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>
</div>

<main class="wrap" id="all">
  <div id="out"></div>
</main>

<footer>
  <div class="wrap">
    <p>海大叔 AI 新媒体工作室 · 云南昆明｜一个人 + AI 干活的地方</p>
    <p>想让我按你的情况挑三条能立刻干的路子：加微信 <b style="color:var(--acc)">haidashu79</b>，说清你会什么、每天有几个小时、想挣多少。</p>
    <p><a href="/zhinao/">→ 回商业智脑继续问</a>　<a href="/products/">→ 看产品体系</a></p>
  </div>
</footer>

<script>
var DATA=null, cur='all', kw='';
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hit(it,c){
  if(!kw) return true;
  var s=(it.name+it.how+it.gate+it.first+it.pit+c.name).toLowerCase();
  return s.indexOf(kw)>=0;
}
function render(){
  if(!DATA){return}
  var h=[], total=0;
  DATA.categories.forEach(function(c){
    if(cur!=='all' && cur!==c.id) return;
    var items=c.items.filter(function(it){return hit(it,c)});
    if(!items.length) return;
    total+=items.length;
    h.push('<section class="sec"><h2>'+esc(c.name)+'</h2><p>'+esc(c.desc)+'</p><div class="grid">');
    items.forEach(function(it){
      h.push('<div class="card"><h3><span class="no">'+it.no+'</span>'+esc(it.name)+'</h3>'
        +'<div class="row"><span class="k">怎么做</span>'+esc(it.how)+'</div>'
        +'<div class="row"><span class="k">门槛</span>'+esc(it.gate)+'</div>'
        +'<div class="row"><span class="k">第一笔钱</span>'+esc(it.first)+'</div>'
        +'<div class="row pit"><span class="k">坑</span>'+esc(it.pit)+'</div></div>');
    });
    h.push('</div></section>');
  });
  document.getElementById('out').innerHTML = total? h.join('') : '<section class="sec"><p>没搜到，换个词试试，比如「口播」「模板」「出海」。</p></section>';
}
function chips(){
  if(!DATA) return;
  var box=document.getElementById('chips'), h=['<span class="chip'+(cur==='all'?' on':'')+'" data-c="all">全部 100 条</span>'];
  DATA.categories.forEach(function(c){
    h.push('<span class="chip'+(cur===c.id?' on':'')+'" data-c="'+c.id+'">'+esc(c.name)+'</span>');
  });
  box.innerHTML=h.join('');
  box.onclick=function(e){
    var t=e.target.closest('.chip'); if(!t) return;
    cur=t.getAttribute('data-c'); chips(); render();
    window.scrollTo({top:document.querySelector('.bar').offsetTop-0,behavior:'smooth'});
  };
}
document.getElementById('kw').oninput=function(e){ kw=e.target.value.trim().toLowerCase(); render(); };
fetch('/zhinao/ai-money.json').then(function(r){return r.json()}).then(function(d){
  DATA=d; document.querySelector('.eyebrow').textContent='海大叔商业智脑 · 方法库 v'+d.version+' · 共 '+d.count+' 条';
  chips(); render();
}).catch(function(){ document.getElementById('out').innerHTML='<section class="sec"><p>方法库加载失败，请<a href="/zhinao/">回智脑</a>问，或刷新重试。</p></section>'; });
</script>
</body>
</html>
