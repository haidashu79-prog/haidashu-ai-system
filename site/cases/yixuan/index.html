<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>易玄机 · 传统术数推演</title>
<meta name="description" content="易玄机｜传统术数推演。真排真算：周易六爻、生辰八字、奇门遁甲、风水布局、万年历、五行八卦，当场精算，文言断语配白话注解，并给破解与改运之法。">
<style>
:root{
  --paper:#f7f3e9; --paper2:#efe8d7; --paper3:#e7deca;
  --ink:#232a2b; --ink2:#4b5456; --ink3:#7c8688;
  --qing:#2f6b5c; --qing2:#3d8574; --lv:#7a9e7e; --lv2:#9db9a0;
  --zhu:#a63a2e; --zhu2:#c4574a; --jin:#b08d4f; --jin2:#cfa96a;
  --line:rgba(47,107,92,.16); --line2:rgba(47,107,92,.30);
  --ok:#4a8a63; --warn:#b8863c; --bad:#a63a2e;
  --r:14px;
  --sh:0 2px 10px rgba(70,60,40,.06), 0 12px 32px rgba(70,60,40,.07);
  --sh2:0 1px 3px rgba(70,60,40,.05);
  --serif:'Songti SC','STSong','Source Han Serif SC','Noto Serif SC',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 700px at 88% -8%, rgba(122,158,126,.16), transparent 62%),
    radial-gradient(1000px 620px at 4% 4%, rgba(47,107,92,.10), transparent 60%),
    radial-gradient(900px 560px at 50% 108%, rgba(176,141,79,.10), transparent 62%),
    linear-gradient(180deg,#faf7ef 0%,#f7f3e9 42%,#f1ebdc 100%);
  background-attachment:fixed;
  color:var(--ink); font:16px/1.8 var(--sans);
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* 宣纸细纹 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:
    radial-gradient(1.2px 1.2px at 14% 18%, rgba(47,107,92,.20), transparent),
    radial-gradient(1px 1px at 34% 62%, rgba(176,141,79,.18), transparent),
    radial-gradient(1.3px 1.3px at 58% 12%, rgba(47,107,92,.14), transparent),
    radial-gradient(1px 1px at 78% 46%, rgba(176,141,79,.16), transparent),
    radial-gradient(1.1px 1.1px at 88% 78%, rgba(47,107,92,.14), transparent),
    radial-gradient(1px 1px at 24% 86%, rgba(176,141,79,.14), transparent);
}
.wrap{position:relative; z-index:1; max-width:1060px; margin:0 auto; padding:0 18px 80px}
/* 金角装饰 */
.wrap::before,.wrap::after{content:""; position:absolute; width:30px; height:30px; z-index:3; pointer-events:none;
  border:2px solid rgba(176,141,79,.5)}
.wrap::before{top:6px; left:6px; border-right:none; border-bottom:none; border-top-left-radius:9px}
.wrap::after{bottom:6px; right:6px; border-left:none; border-top:none; border-bottom-right-radius:9px}

/* ============ 青绿山水 Banner ============ */
.scene{position:relative; margin:0 -18px; height:250px; overflow:hidden; pointer-events:none;
  border-radius:0 0 20px 20px; opacity:.96;
  box-shadow:0 10px 30px rgba(70,60,40,.10), inset 0 -1px 0 rgba(176,141,79,.5)}
.scene svg{width:100%; height:100%; display:block}
.scene::after{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 0%, transparent 50%, rgba(247,243,233,.5) 80%, rgba(247,243,233,.98) 100%)}
/* 金线描边画框 */
.hero-frame{position:absolute; inset:10px; border:1.5px solid rgba(176,141,79,.55); border-radius:13px;
  pointer-events:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.hero-frame::after{content:""; position:absolute; inset:5px; border:1px solid rgba(176,141,79,.30); border-radius:9px}
/* Banner 内的动效 */
.wm{opacity:.05}
.sun{transform-box:fill-box; transform-origin:center; animation:sunPulse 5.5s ease-in-out infinite;
  filter:drop-shadow(0 0 12px rgba(234,181,116,.7))}
@keyframes sunPulse{0%,100%{opacity:.6; transform:scale(1)} 50%{opacity:.95; transform:scale(1.14)}}
.mist{animation:mistDrift 16s ease-in-out infinite alternate}
.mist2{animation:mistDrift 22s ease-in-out infinite alternate-reverse}
@keyframes mistDrift{from{transform:translateX(-12px)} to{transform:translateX(36px)}}

/* ============ 卷轴装饰 ============ */
.rod{height:14px; background:linear-gradient(180deg,#d8cfb8,#bdb094 40%,#a89b7c); border-radius:7px;
  box-shadow:0 2px 6px rgba(80,68,48,.22) inset, 0 1px 2px rgba(80,68,48,.14); position:relative}
.rod::before,.rod::after{content:""; position:absolute; top:-4px; width:16px; height:22px; border-radius:5px;
  background:linear-gradient(180deg,#c9bda2,#9c8f72); box-shadow:0 1px 3px rgba(80,68,48,.28)}
.rod::before{left:-12px} .rod::after{right:-12px}

/* ============ 头部 ============ */
header.top{padding:30px 0 14px; text-align:center; position:relative}
.brand{display:inline-flex; align-items:baseline; gap:11px}
h1{font-family:var(--serif); font-size:40px; font-weight:600; letter-spacing:.22em;
  background:linear-gradient(96deg,#1f5548 0%,var(--qing2) 32%,var(--jin) 68%,var(--zhu) 100%);
  background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; text-indent:.22em;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.7)); animation:titleShimmer 7s linear infinite}
@keyframes titleShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.seal{display:inline-block; width:40px; height:40px; border-radius:8px; background:linear-gradient(160deg,#bf463b,#8f2f26);
  color:#fff6ec; font-family:var(--serif); font-size:13px; line-height:1.06; padding:4px 0; text-align:center;
  box-shadow:0 4px 12px rgba(140,47,38,.38), inset 0 1px 0 rgba(255,255,255,.28); letter-spacing:0; vertical-align:middle;
  transform:rotate(-3deg); border:1px solid rgba(255,240,230,.5); position:relative}
.seal::after{content:""; position:absolute; inset:3px; border:1px solid rgba(255,240,230,.42); border-radius:5px}
.sub{margin-top:9px; color:var(--ink3); font-size:13.5px; letter-spacing:.14em}
.sub b{color:var(--qing); font-weight:600}
.chipline{margin-top:13px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap}
.chipline span{font-size:12.5px; color:var(--qing); letter-spacing:.08em; padding:3px 12px; border-radius:20px;
  background:rgba(255,253,247,.72); border:1px solid var(--line2); backdrop-filter:blur(3px)}
.chipline span::before{content:"· "; color:var(--jin)}

/* ============ 通用卡片 ============ */
.card{background:linear-gradient(160deg,#fffdf7,#faf6ec); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--sh); padding:20px 20px 18px; position:relative}
.card::before{content:""; position:absolute; left:0; right:0; top:0; height:2px; border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,transparent,rgba(176,141,79,.55),transparent)}
.card+.card{margin-top:14px}
.sec-h{display:flex; align-items:center; gap:9px; margin:0 0 12px}
.sec-h .bar{width:3px; height:17px; background:linear-gradient(180deg,var(--qing),var(--lv)); border-radius:2px}
.sec-h h2{font-family:var(--serif); font-size:17.5px; font-weight:600; color:var(--qing); letter-spacing:.08em}
.sec-h .hint{margin-left:auto; font-size:12.5px; color:var(--ink3)}

/* ============ 入口 ============ */
.hero{text-align:center; padding:6px 4px 8px}
.hero .lead{font-family:var(--serif); font-size:23px; line-height:1.7; color:var(--ink); letter-spacing:.03em}
.hero .lead em{color:var(--zhu); font-style:normal; font-weight:600;
  background:linear-gradient(transparent 66%, rgba(207,169,106,.34) 66%); padding:0 2px}
.hero .desc{margin-top:11px; color:var(--ink2); font-size:14.5px; max-width:640px; margin-left:auto; margin-right:auto; line-height:1.85}
.hero .desc .d-short{display:none}
.cta{display:flex; gap:11px; justify-content:center; flex-wrap:wrap; margin-top:19px}
.btn.big{position:relative; padding:13px 30px; font-size:16px; letter-spacing:.1em; border-radius:11px;
  background:linear-gradient(120deg,var(--qing),var(--qing2) 42%,var(--jin) 78%,var(--qing)); background-size:200% auto;
  animation:btnShimmer 6s linear infinite}
.btn.big.ghost{background:rgba(255,253,248,.86); color:var(--qing); border-color:var(--line2); animation:none}
@keyframes btnShimmer{to{background-position:200% center}}
.entries{display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-top:22px}
.entry{background:linear-gradient(160deg,#fffdf8,#f8f4e9); border:1px solid var(--line); border-radius:13px;
  padding:15px 14px 16px; cursor:pointer; transition:.2s cubic-bezier(.2,.7,.3,1); text-align:left;
  position:relative; overflow:hidden}
.entry::after{content:""; position:absolute; right:-30px; top:-30px; width:80px; height:80px; border-radius:50%;
  background:radial-gradient(circle, rgba(207,169,106,.16), transparent 70%); opacity:0; transition:.25s}
.entry:hover{border-color:var(--line2); transform:translateY(-3px);
  box-shadow:0 3px 8px rgba(70,60,40,.06), 0 16px 34px rgba(70,60,40,.10)}
.entry:hover::after{opacity:1}
.entry::before{content:""; position:absolute; left:14px; right:14px; top:0; height:3px; border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--qing),var(--jin),var(--zhu)); opacity:0; transition:.22s}
.entry:hover::before{opacity:1}
.entries .entry{opacity:0; animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both}
.entries .entry:nth-child(1){animation-delay:.05s}
.entries .entry:nth-child(2){animation-delay:.10s}
.entries .entry:nth-child(3){animation-delay:.15s}
.entries .entry:nth-child(4){animation-delay:.20s}
.entries .entry:nth-child(5){animation-delay:.25s}
.entries .entry:nth-child(6){animation-delay:.30s}
.entries .entry:nth-child(7){animation-delay:.35s}
.entries .entry:nth-child(8){animation-delay:.40s}
@keyframes riseIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.entry .ic{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:20px; color:#fffdf7; line-height:1;
  background:linear-gradient(150deg,var(--a),var(--b)); box-shadow:0 4px 11px rgba(47,107,92,.20), inset 0 1px 0 rgba(255,255,255,.22)}
.entry .tt{font-family:var(--serif); font-size:16.5px; font-weight:600; margin-top:10px; letter-spacing:.06em}
.entry .dd{font-size:12.5px; color:var(--ink3); margin-top:5px; line-height:1.62}
.entry .badge{position:absolute; right:10px; top:10px; font-size:10.5px; color:var(--jin);
  border:1px solid var(--jin2); border-radius:20px; padding:1px 7px; background:rgba(207,169,106,.12)}
.entry.tone-live{background:linear-gradient(160deg,#fffdf8,#f6f2e4)}

/* 今日条 */
.todaybar{margin-top:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
  padding:11px 14px; border-radius:11px; border:1px solid rgba(176,141,79,.28);
  background:linear-gradient(160deg,#fdf8ee,#f9f2e2)}
.todaybar .tk{font-family:var(--serif); font-size:13px; color:#8a6a2c; letter-spacing:.1em; flex:0 0 auto}
.todaybar .tv{font-size:13.5px; color:#5f4a22; line-height:1.75}
.todaybar .tv b{font-family:var(--serif); color:var(--zhu); font-weight:600}

/* ============ 表单 ============ */
.frow{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
.fld{display:flex; flex-direction:column; gap:6px; flex:1 1 150px; min-width:0}
.fld label{font-size:12.5px; color:var(--ink2); letter-spacing:.04em}
input,select,textarea{width:100%; font:15px/1.6 var(--sans); color:var(--ink);
  background:#fffdf8; border:1px solid var(--line2); border-radius:9px; padding:9px 11px; outline:none; transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--qing2); box-shadow:0 0 0 3px rgba(61,133,116,.11)}
textarea{resize:vertical; min-height:74px}
input[type=checkbox],input[type=radio]{width:auto; appearance:auto; accent-color:var(--qing)}
.chk{display:inline-flex; align-items:center; gap:7px; font-size:14px; color:var(--ink2); cursor:pointer}
.btn{font:15px var(--sans); border:1px solid var(--qing); border-radius:9px; padding:10px 20px; cursor:pointer;
  background:linear-gradient(160deg,var(--qing2),var(--qing)); color:#f7fbf9; letter-spacing:.08em; transition:.16s}
.btn:hover{filter:brightness(1.06); box-shadow:0 4px 14px rgba(47,107,92,.22), 0 0 0 1px rgba(207,169,106,.32)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:#fffdf8; color:var(--qing); border-color:var(--line2)}
.btn.sm{padding:7px 14px; font-size:13.5px}
.tools{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* ============ 结果 ============ */
.res{margin-top:16px}
.rsec{border-left:2px solid var(--lv2); padding:2px 0 2px 14px; margin:16px 0}
.rsec:first-child{margin-top:6px}
.rsec h3{font-family:var(--serif); font-size:15.5px; color:var(--qing); letter-spacing:.08em; margin-bottom:8px; display:flex; align-items:center; gap:7px}
.rsec h3 .dot{width:6px; height:6px; border-radius:50%; background:var(--jin); flex:0 0 auto}
.wen,.bai{font-size:14.5px; line-height:1.95; border-radius:9px; padding:11px 13px; margin-top:7px}
.wen{font-family:var(--serif); background:linear-gradient(160deg,#f3eee0,#ece5d3); color:#3a4243;
  border:1px solid rgba(176,141,79,.24); letter-spacing:.03em}
.wen::before{content:"原文"; font-family:var(--sans); font-size:10.5px; color:var(--jin);
  border:1px solid var(--jin2); border-radius:4px; padding:0 5px; margin-right:8px; vertical-align:2px; letter-spacing:0}
.bai{background:linear-gradient(160deg,#f4f9f5,#eaf2ec); color:#2c3a34; border:1px solid rgba(122,158,126,.26)}
.bai::before{content:"白话"; font-family:var(--sans); font-size:10.5px; color:var(--qing);
  border:1px solid var(--lv2); border-radius:4px; padding:0 5px; margin-right:8px; vertical-align:2px; letter-spacing:0}

/* 数据表 */
.dt{width:100%; border-collapse:collapse; margin-top:10px; font-size:13.5px}
.dt th,.dt td{border:1px solid var(--line); padding:7px 9px; text-align:center}
.dt th{background:rgba(47,107,92,.06); font-family:var(--serif); color:var(--qing); font-weight:600}
.dt td.k{background:rgba(176,141,79,.06); font-family:var(--serif)}

/* 卦象 */
.hexbox{display:flex; gap:18px; flex-wrap:wrap; align-items:center; justify-content:center; margin:6px 0 12px}
.glyph{font-size:74px; line-height:1; color:var(--qing)}
.yaolite{display:flex; flex-direction:column; gap:3px}
.yao{display:flex; align-items:center; gap:7px; font-size:12.5px}
.yao .b{width:52px; height:9px; border-radius:2px; display:flex; gap:5px}
.yao .b i{background:var(--ink); border-radius:2px; height:100%; display:block}
.yao .b.yang i{width:100%; flex:1}
.yao .b.yin{justify-content:space-between}
.yao .b.yin i{flex:1}
.yao .b.yin::after{content:""; width:5px}
.yao.mv .b i{background:var(--zhu)}
.yao .t{color:var(--ink3)}
.yao .ss{color:var(--qing); font-family:var(--serif)}

/* 九宫盘 */
.qm{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:520px; margin:10px auto}
.qm .g{border:1px solid var(--line); border-radius:9px; background:#fffdf8; padding:8px 6px; text-align:center; font-size:12px; line-height:1.55}
.qm .g.hi{border-color:var(--zhu2); background:rgba(166,58,46,.05)}
.qm .g .n{font-family:var(--serif); color:var(--qing); font-size:13.5px; font-weight:600}
.qm .g .s{color:var(--ink2)}
.qm .g .sg{color:var(--ink3); font-size:11px}

/* 条形 */
.bar-row{display:grid; grid-template-columns:26px 1fr 44px; gap:9px; align-items:center; margin:5px 0; font-size:13px}
.bar-row .t{font-family:var(--serif); color:var(--qing)}
.bar-row .bt{height:9px; background:rgba(47,107,92,.09); border-radius:5px; overflow:hidden}
.bar-row .bf{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--qing),var(--lv))}
.bar-row .v{text-align:right; color:var(--ink3); font-size:12px}

/* 提示 */
.tip{margin-top:12px; padding:11px 13px; border-radius:9px; font-size:13px; line-height:1.8}
.tip.warn{background:rgba(184,134,60,.09); border:1px solid rgba(184,134,60,.28); color:#6d5222}
.tip.ok{background:rgba(74,138,99,.08); border:1px solid rgba(74,138,99,.26); color:#2e5b41}
.tip.fix{background:linear-gradient(160deg,#fdf6ea,#faf0dd); border:1px solid rgba(176,141,79,.34); color:#5f4a22}
.tip.fix b{font-family:var(--serif)}
.fixlist{margin:8px 0 0 0; padding-left:0; list-style:none}
.fixlist li{padding:8px 11px; margin-top:7px; border-radius:8px; background:linear-gradient(160deg,#fdf8ee,#f9f2e2);
  border:1px solid rgba(176,141,79,.26); font-size:13.5px; line-height:1.85}
.fixlist li b{color:var(--zhu); font-family:var(--serif)}

/* ============ 结论卡（白话版 · 先给答案） ============ */
.vd{border:1px solid var(--line2); border-radius:14px; overflow:hidden; margin-top:16px;
  background:linear-gradient(165deg,#fffdf7,#f7f4e8); box-shadow:var(--sh)}
.vd-h{display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); background:rgba(47,107,92,.05)}
.vd-h .tag{font-family:var(--serif); font-size:13.5px; color:var(--qing); letter-spacing:.1em}
.vd-h .bdg{margin-left:auto; font-size:13.5px; padding:3px 13px; border-radius:20px; letter-spacing:.08em;
  font-family:var(--serif)}
.vd-h .bdg.ok{background:rgba(74,138,99,.13); color:#2b5940; border:1px solid rgba(74,138,99,.32)}
.vd-h .bdg.mid{background:rgba(184,134,60,.13); color:#6a4f1f; border:1px solid rgba(184,134,60,.32)}
.vd-h .bdg.warn{background:rgba(176,141,79,.16); color:#674f22; border:1px solid rgba(176,141,79,.36)}
.vd-h .bdg.bad{background:rgba(166,58,46,.10); color:#8a3227; border:1px solid rgba(166,58,46,.30)}
.vd-b{padding:16px 16px 18px}
.vd-q{font-size:13px; color:var(--ink2); line-height:1.7}
.vd-q b{color:var(--ink); font-weight:600}
.vd-me{margin-top:9px; padding:9px 12px; border-radius:9px; border-left:3px solid var(--jin2);
  background:linear-gradient(90deg,rgba(207,169,106,.13),rgba(207,169,106,.03));
  font-size:13px; color:#5f4a22; line-height:1.75}
.vd-me.nog{border-left-color:var(--line2); background:rgba(47,107,92,.05); color:var(--ink3); font-size:12.5px}
.vd-head{font-family:var(--serif); font-size:23px; line-height:1.62; color:#20302b; letter-spacing:.02em; margin-top:9px}
.vd-meter{display:flex; align-items:center; gap:10px; margin-top:13px}
.vd-meter .mv{font-size:12px; color:var(--ink3); flex:0 0 auto}
.vd-meter .mt{flex:1; height:8px; border-radius:5px; background:rgba(47,107,92,.10); overflow:hidden}
.vd-meter .mt i{display:block; height:100%; border-radius:5px;
  background:linear-gradient(90deg,var(--zhu2),var(--jin),var(--lv),var(--qing)); transition:width .5s}
/* 话外音：缝进结论卡的人性那一层（暖朱调，区别于金色命主行） */
.vd-hm{margin-top:14px; padding:12px 14px; border-radius:11px;
  background:linear-gradient(160deg,rgba(166,58,46,.06),rgba(176,141,79,.05));
  border:1px solid rgba(166,58,46,.18); border-left:3px solid var(--zhu2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.vd-hm-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.vd-hm-h .tag{font-family:var(--serif); font-size:13px; color:var(--zhu); letter-spacing:.1em}
.vd-hm .hv{font-size:11.5px; padding:2px 9px; border-radius:20px;
  background:rgba(166,58,46,.10); color:#8a3227; border:1px solid rgba(166,58,46,.24)}
.vd-hm .hv.mid{background:rgba(184,134,60,.12); color:#6a4f1f; border-color:rgba(184,134,60,.30)}
.vd-hm .hv.tight{background:rgba(166,58,46,.16); color:#7a2a20; border-color:rgba(166,58,46,.34)}
.vd-hm-main{font-size:12.5px; color:var(--ink2)}
.vd-hm-me{margin-top:8px; font-size:12.5px; line-height:1.7; color:#5f4a22;
  background:linear-gradient(90deg,rgba(207,169,106,.13),rgba(207,169,106,.02));
  padding:7px 10px; border-radius:8px; border-left:2px solid var(--jin2)}
.vd-hm-truth{margin-top:9px; font-family:var(--serif); font-size:14.5px; line-height:1.8; color:#3a2f25;
  display:flex; gap:7px; align-items:flex-start}
.vd-hm-truth .bar{width:3px; min-height:14px; border-radius:2px; margin-top:3px;
  background:linear-gradient(180deg,var(--zhu2),var(--jin)); flex:0 0 auto}
/* 因人答法：同一卦同一问，换个命主就换套答法（青绿金线，区别于暖朱话外音块） */
.vd-need{margin-top:14px; padding:12px 14px; border-radius:11px;
  background:linear-gradient(160deg,rgba(47,107,92,.07),rgba(207,169,106,.06));
  border:1px solid rgba(47,107,92,.20); border-left:3px solid var(--qing);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.vd-need-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.vd-need-h .tag{font-family:var(--serif); font-size:13px; color:var(--qing); letter-spacing:.1em}
.vd-need .tn{font-size:11.5px; padding:2px 9px; border-radius:20px;
  font-family:var(--serif); letter-spacing:.05em}
.vd-need .tn.push{background:rgba(47,107,92,.14); color:#1f4d41; border:1px solid rgba(47,107,92,.34)}
.vd-need .tn.gentle{background:rgba(207,169,106,.16); color:#6a4f1f; border:1px solid rgba(207,169,106,.38)}
.vd-need-who{font-size:12.5px; color:var(--ink2); line-height:1.7}
.vd-need-open{margin-top:8px; font-size:14px; line-height:1.86; color:#2b3a34}
.vd-need-stress{margin-top:9px; font-size:13px; line-height:1.8; color:#5f4a22;
  background:linear-gradient(90deg,rgba(207,169,106,.13),rgba(207,169,106,.02));
  padding:7px 10px; border-radius:8px; border-left:2px solid var(--jin2);
  display:flex; gap:7px; align-items:flex-start}
.vd-need-stress .bar{width:3px; min-height:14px; border-radius:2px; margin-top:3px;
  background:linear-gradient(180deg,var(--jin),var(--jin2)); flex:0 0 auto}
.vd-sub{margin:20px 0 4px; font-family:var(--serif); font-size:15px; color:var(--qing);
  letter-spacing:.08em; display:flex; align-items:center; gap:8px}
.vd-sub .bar{width:3px; height:15px; background:linear-gradient(180deg,var(--qing),var(--lv)); border-radius:2px}
.vd-li{display:flex; gap:9px; font-size:15px; line-height:1.86; margin-top:9px; color:#2b3a34}
.vd-li .n{flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:rgba(47,107,92,.10);
  color:var(--qing); font-size:11.5px; display:flex; align-items:center; justify-content:center;
  margin-top:4px; font-family:var(--serif)}
.vd-act{background:linear-gradient(160deg,#fdf8ee,#f9f2e2); border:1px solid rgba(176,141,79,.30);
  border-radius:11px; padding:11px 14px; margin-top:9px}
.vd-act .vd-li{margin-top:0}
.vd-act .vd-li .n{background:rgba(176,141,79,.18); color:#87682a}
.vd-tools{display:flex; gap:9px; flex-wrap:wrap; margin-top:18px; align-items:center}
.vd .det{margin-top:18px; border-top:1px dashed var(--line); padding-top:13px}
.vd .det summary{cursor:pointer; font-family:var(--serif); font-size:14.5px; color:var(--qing);
  letter-spacing:.06em; outline:none; list-style:none}
.vd .det summary::-webkit-details-marker{display:none}
.vd .det summary::before{content:"▸ "; color:var(--jin); font-size:12px}
.vd .det[open] summary::before{content:"▾ "}
.vd .det[open] summary{margin-bottom:10px}
.vd-note{font-size:12.5px; color:var(--ink3); margin-top:11px; line-height:1.75}
.vd-mini{margin-top:14px; padding:11px 13px; border-radius:10px; font-size:13px; line-height:1.8;
  background:rgba(47,107,92,.05); border:1px solid var(--line); color:var(--ink2)}

/* ============ 学习台阶 ============ */
.ladder{margin-top:6px}
.step{position:relative; padding:13px 15px 14px 48px; border:1px solid var(--line); border-radius:11px;
  background:linear-gradient(160deg,#fffdf8,#f8f4e9); margin-top:10px}
.step::before{content:attr(data-n); position:absolute; left:13px; top:13px; width:25px; height:25px;
  border-radius:7px; background:linear-gradient(160deg,var(--qing2),var(--qing)); color:#f7fbf9;
  font-family:var(--serif); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center}
.step h4{font-family:var(--serif); font-size:15.5px; color:var(--qing); letter-spacing:.06em}
.step .meta{font-size:12px; color:var(--jin); margin-top:3px; letter-spacing:.05em}
.step .txt{font-size:14.5px; color:#2b3a34; line-height:1.86; margin-top:7px}
.step .drill{margin-top:9px; font-size:13.5px; color:var(--ink2); line-height:1.8;
  background:rgba(47,107,92,.05); border-left:2px solid var(--lv2); border-radius:0 8px 8px 0; padding:8px 11px}
.step .drill b{color:var(--qing); font-family:var(--serif); font-weight:600}
.blk{margin-top:10px; padding:12px 14px; border-radius:11px; font-size:14.5px; line-height:1.88;
  background:linear-gradient(160deg,#fdf8ee,#f9f2e2); border:1px solid rgba(176,141,79,.28); color:#4f3f1f}
.blk b{font-family:var(--serif); color:#7a5c22}
.blk .it{display:block; margin-top:7px}
.blk .it:first-child{margin-top:0}
.books li{list-style:none; padding:9px 0 9px 0; border-bottom:1px dashed var(--line); font-size:14px;
  line-height:1.8; color:var(--ink2)}
.books li:last-child{border-bottom:none}
.books li b{font-family:var(--serif); color:var(--qing); font-size:14.5px}
.say{border-left:3px solid var(--zhu2); padding:6px 0 6px 13px; margin-top:11px; font-size:14.5px;
  line-height:1.88; color:#3a3129}
.say b{font-family:var(--serif); color:var(--zhu)}
.det2{margin-top:12px; border-top:1px dashed var(--line); padding-top:11px}
.det2 summary{cursor:pointer; font-family:var(--serif); font-size:14.5px; color:var(--qing);
  letter-spacing:.06em; outline:none; list-style:none}
.det2 summary::-webkit-details-marker{display:none}
.det2 summary::before{content:"▸ "; color:var(--jin); font-size:12px}
.det2[open] summary::before{content:"▾ "}
.det2[open] summary{margin-bottom:6px}

/* ============ 典籍库 ============ */
.tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
.tab{border:1px solid var(--line2); background:#fffdf8; color:var(--qing); border-radius:20px;
  padding:6px 15px; font:14px var(--sans); cursor:pointer; transition:.15s; letter-spacing:.04em}
.tab:hover{background:#f4f9f5}
.tab.on{background:linear-gradient(160deg,var(--qing2),var(--qing)); color:#f7fbf9; border-color:var(--qing)}
.cmsearch{display:flex; gap:9px; align-items:center; margin-bottom:14px}
.cmsearch input{flex:1}
.cmcount{font-size:12.5px; color:var(--ink3); margin-bottom:10px}
.tcard{border:1px solid var(--line); border-radius:11px; background:linear-gradient(160deg,#fffdf8,#f8f4e9);
  padding:12px 14px; margin-top:9px}
.tcard .th{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.tcard .th b{font-family:var(--serif); font-size:16px; color:var(--qing); letter-spacing:.06em}
.tcard .th .cat{font-size:11px; color:var(--jin); border:1px solid var(--jin2); border-radius:20px;
  padding:0 7px; background:rgba(207,169,106,.10)}
.tcard .wen{font-family:var(--serif); font-size:14px; background:linear-gradient(160deg,#f3eee0,#ece5d3);
  color:#3a4243; border:1px solid rgba(176,141,79,.22); border-radius:8px; padding:8px 11px; margin-top:8px; line-height:1.9}
.tcard .bai{font-size:14.5px; color:#2b3a34; line-height:1.86; margin-top:8px}
.tcard .bai::before{content:"白话"; font-family:var(--sans); font-size:10.5px; color:var(--qing);
  border:1px solid var(--lv2); border-radius:4px; padding:0 5px; margin-right:8px; vertical-align:2px; letter-spacing:0}
.tcard .use{font-size:13.5px; color:var(--ink2); line-height:1.8; margin-top:8px;
  background:rgba(47,107,92,.05); border-left:2px solid var(--lv2); border-radius:0 8px 8px 0; padding:8px 11px}
.tcard .use::before{content:"怎么用　"; font-family:var(--serif); color:var(--qing)}
.cmgrp{margin-top:18px}
.cmgrp>h3{font-family:var(--serif); font-size:15.5px; color:var(--qing); letter-spacing:.08em;
  display:flex; align-items:center; gap:8px; margin-bottom:4px}
.cmgrp>h3 .bar{width:3px; height:15px; background:linear-gradient(180deg,var(--qing),var(--lv)); border-radius:2px}
.bk{border:1px solid var(--line2); border-radius:12px; background:linear-gradient(165deg,#fffdf7,#f8f4e8);
  padding:15px 16px; margin-top:12px; box-shadow:var(--sh2)}
.bk h4{font-family:var(--serif); font-size:17.5px; color:var(--qing); letter-spacing:.06em}
.bk .meta{font-size:12.5px; color:var(--jin); margin-top:3px; letter-spacing:.05em}
.bk .about{font-size:14.5px; color:#2b3a34; line-height:1.88; margin-top:9px}
.bk .howto{font-size:13.5px; color:var(--ink2); line-height:1.82; margin-top:9px;
  background:rgba(47,107,92,.05); border-left:2px solid var(--lv2); border-radius:0 8px 8px 0; padding:9px 11px}
.bk .howto b{font-family:var(--serif); color:var(--qing)}
.pg{margin-top:13px; padding-top:12px; border-top:1px dashed var(--line)}
.pg .from{font-family:var(--serif); font-size:13.5px; color:var(--zhu); letter-spacing:.06em}
.pg .wen{font-family:var(--serif); font-size:16px; line-height:1.95; color:#2f3839;
  background:linear-gradient(160deg,#f3eee0,#ece5d3); border:1px solid rgba(176,141,79,.26);
  border-radius:9px; padding:11px 13px; margin-top:7px; letter-spacing:.04em}
.pg .nt{display:flex; gap:8px; font-size:13.5px; line-height:1.82; margin-top:7px; color:var(--ink2)}
.pg .nt .w{flex:0 0 auto; font-family:var(--serif); color:var(--zhu); border-bottom:1px dotted var(--zhu2); height:1.7em}
.pg .bai{font-size:14.5px; color:#2b3a34; line-height:1.88; margin-top:9px;
  background:linear-gradient(160deg,#f4f9f5,#eaf2ec); border:1px solid rgba(122,158,126,.26);
  border-radius:9px; padding:10px 12px}
.pg .use{font-size:13.5px; color:var(--ink2); line-height:1.82; margin-top:8px}
.pg .use::before{content:"怎么用　"; font-family:var(--serif); color:var(--qing)}
.sg{border:1px solid var(--line); border-radius:11px; background:#fffdf8; padding:14px 16px; margin-top:11px}
.sg h4{font-family:var(--serif); font-size:16px; color:var(--qing); letter-spacing:.06em}
.sg .src{font-size:12px; color:var(--jin); margin-top:2px}
.sg .ln{padding:9px 0; border-bottom:1px dashed var(--line)}
.sg .ln:last-of-type{border-bottom:none}
.sg .ln .w{font-family:var(--serif); font-size:15px; color:#2f3839; line-height:1.85; letter-spacing:.03em}
.sg .ln .z{font-size:13.5px; color:var(--ink2); line-height:1.8; margin-top:4px}
.sg .bai{font-size:14.5px; color:#2b3a34; line-height:1.88; margin-top:10px;
  background:linear-gradient(160deg,#f4f9f5,#eaf2ec); border:1px solid rgba(122,158,126,.26); border-radius:9px; padding:10px 12px}
.hexx{border:1px solid var(--line); border-radius:11px; background:#fffdf8; margin-top:9px}
.hexx summary{cursor:pointer; padding:11px 14px; display:flex; align-items:center; gap:10px; list-style:none}
.hexx summary::-webkit-details-marker{display:none}
.hexx summary .g{font-size:26px; color:var(--qing); line-height:1}
.hexx summary .n{font-family:var(--serif); font-size:15px; color:var(--qing)}
.hexx summary .i{font-size:12px; color:var(--ink3); margin-left:auto}
.hexx[open] summary{border-bottom:1px dashed var(--line)}
.hexx .body{padding:12px 14px}
.hexx .gz{font-family:var(--serif); font-size:14.5px; color:#2f3839; line-height:1.9}
.hexx .yc{font-size:13.5px; color:var(--ink2); line-height:1.85; margin-top:7px}
.hexx .yc b{font-family:var(--serif); color:var(--zhu); font-weight:600}
.hexx .bh{font-size:14px; color:#2b3a34; line-height:1.86; margin-top:9px}
mark{background:rgba(207,169,106,.32); color:inherit; border-radius:3px; padding:0 2px}

/* 加载 */
.loading{display:inline-flex; align-items:center; gap:9px; color:var(--ink3); font-size:14px}
.spin{width:15px; height:15px; border:2px solid var(--line2); border-top-color:var(--qing); border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.caret{display:inline-block; width:7px; height:15px; background:var(--qing); animation:bl .9s steps(1) infinite; vertical-align:-2px; margin-left:2px}
@keyframes bl{50%{opacity:0}}

/* 问答 */
.qa-out{margin-top:14px}
.answer{position:relative; border:1px solid var(--line); border-radius:14px; background:linear-gradient(170deg,#fffefa,#fdf9ef);
  padding:18px 20px 16px; box-shadow:var(--sh2); overflow:hidden; animation:ansIn .45s ease both}
.answer::before{content:""; position:absolute; left:0; top:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--qing2),var(--jin),var(--qing2)); opacity:.75}
@keyframes ansIn{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:none}}
.answer .who{font-family:var(--serif); color:var(--qing); font-size:14px; letter-spacing:.2em; margin-bottom:12px;
  display:flex; align-items:center; gap:8px}
.answer .who::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--jin); flex:none;
  box-shadow:0 0 0 3px rgba(176,141,64,.14)}
.answer .who::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line2),transparent)}
.answer .body{white-space:pre-wrap; font-size:15.5px; line-height:2.1; letter-spacing:.012em; color:#28302e}
@media (max-width:430px){.answer{padding:15px 14px 13px}.answer .body{font-size:14.5px;line-height:2}}

/* 问过的事（档案条） */
.case-strip{margin-top:13px}
.case-strip .cs-h{font-size:12.5px; color:var(--ink3); margin-bottom:7px; display:flex; align-items:center; gap:8px}
.case-strip .cs-h::before{content:""; width:14px; height:1px; background:var(--jin)}
.case-strip .cs-tip{font-size:11.5px; color:var(--ink3); opacity:.85}
.case-chip{display:inline-flex; align-items:center; gap:6px; max-width:100%}
.case-chip .cc-meta{font-size:11px; color:var(--jin); flex:none}

/* 答题卡 */
.mask{position:fixed; inset:0; background:rgba(35,42,43,.42); backdrop-filter:blur(3px); z-index:90;
  display:flex; align-items:center; justify-content:center; padding:16px}
.qbox{background:linear-gradient(165deg,#fffdf7,#f8f4e8); border:1px solid var(--line2); border-radius:16px;
  box-shadow:0 22px 60px rgba(50,42,30,.26); width:min(460px,100%); max-height:88vh; overflow:auto; padding:22px 20px 18px; position:relative}
.qbox h4{font-family:var(--serif); font-size:17px; color:var(--qing); letter-spacing:.06em; margin-bottom:5px}
.qbox .qno{font-size:12px; color:var(--jin); letter-spacing:.1em}
.qbox .qt{margin:10px 0 14px; font-size:15.5px; line-height:1.8; color:var(--ink)}
.opt{display:block; width:100%; text-align:left; margin-top:9px; padding:11px 14px; border-radius:10px;
  border:1px solid var(--line2); background:#fffdf8; font:15px var(--sans); color:var(--ink); cursor:pointer; transition:.15s}
.opt:hover{border-color:var(--qing2); background:#f4f9f5}
.opt .od{display:block; font-size:12.5px; color:var(--ink3); margin-top:3px}
.qclose{position:absolute; right:12px; top:10px; border:none; background:none; font-size:20px; color:var(--ink3); cursor:pointer; line-height:1}
.qrecap{margin-top:12px; font-size:13px; color:var(--ok); background:rgba(74,138,99,.08); border-radius:8px; padding:9px 11px}
.qprog{height:4px; background:rgba(47,107,92,.10); border-radius:3px; margin-top:14px; overflow:hidden}
.qprog i{display:block; height:100%; background:linear-gradient(90deg,var(--qing),var(--jin)); transition:width .3s}

/* toast */
.toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); opacity:0;
  background:rgba(35,42,43,.9); color:#f7f3e9; font-size:13.5px; padding:10px 18px; border-radius:22px;
  z-index:200; transition:.24s; pointer-events:none}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* 页脚 */
footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--line); color:var(--ink3); font-size:12.5px; line-height:1.9; text-align:center}
footer .dm{font-family:var(--serif); color:var(--jin); letter-spacing:.06em}
footer a{color:var(--qing); cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--line2)}

/* 顶栏返回 */
.pbar{display:flex; align-items:center; gap:10px; margin:20px 0 4px}
.back{width:34px; height:34px; border-radius:9px; border:1px solid var(--line2); background:#fffdf8;
  cursor:pointer; color:var(--qing); font-size:17px; line-height:1; display:flex; align-items:center; justify-content:center}
.back:hover{background:#f4f9f5}
.pbar .pt{font-family:var(--serif); color:var(--ink3); font-size:13.5px; letter-spacing:.08em}

/* 后台 */
.adm{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px}
.adm .c{border:1px solid var(--line); border-radius:10px; background:#fffdf8; padding:12px; text-align:center}
.adm .c .n{font-size:22px; font-family:var(--serif); color:var(--qing)}
.adm .c .l{font-size:11.5px; color:var(--ink3); margin-top:3px}
.rows{margin-top:12px; font-size:13px}
.rows .r{display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); align-items:center}
.rows .r .t{color:var(--ink3); flex:0 0 auto; font-size:12px}
.rows .bt{height:8px; background:rgba(47,107,92,.09); border-radius:4px; overflow:hidden; display:block}
.rows .bt i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--qing),var(--lv))}
.qline{font-size:13px; color:var(--ink); padding:0 0 8px; border-bottom:1px dashed var(--line); line-height:1.7}
/* 30 天趋势柱 */
.trend{display:flex; align-items:flex-end; gap:3px; height:110px; margin-top:10px; padding-bottom:2px; border-bottom:1px solid var(--line)}
.trend .tb{flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px}
.trend .tb i{display:block; width:100%; border-radius:3px 3px 0 0; background:linear-gradient(180deg,var(--lv),var(--qing)); min-height:3px}
.trend .tb span{font-size:9px; color:var(--ink3); line-height:1}
.trend-x{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink3); margin-top:5px}

/* ============ 动效与细节 ============ */
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
#view{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
#view>.card{animation:none}
.card{transition:box-shadow .22s}
.btn{position:relative; overflow:hidden}
.btn::after{content:""; position:absolute; top:0; left:-60%; width:45%; height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.34), transparent); transform:skewX(-18deg);
  transition:left .5s ease}
.btn:hover::after{left:118%}
.btn.ghost::after{background:linear-gradient(100deg, transparent, rgba(47,107,92,.10), transparent)}
.step,.tcard,.bk,.sg,.hexx,.opt{transition:border-color .18s, box-shadow .18s, transform .18s}
.tcard:hover,.bk:hover,.sg:hover{border-color:var(--line2); box-shadow:0 2px 10px rgba(70,60,40,.06)}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:rgba(47,107,92,.05)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#a8c1b4,#7fa491); border-radius:6px;
  border:3px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#8fb2a1,#5d8a77); background-clip:padding-box}
::selection{background:rgba(207,169,106,.34)}

/* ---- 经验库 · 云记忆 ---- */
.memstat{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
.memstat .ms{border:1px solid var(--line); border-radius:12px; background:linear-gradient(160deg,#fffdf8,#f6f2e6);
  padding:11px 12px; text-align:center; box-shadow:var(--sh2)}
.memstat .ms b{display:block; font-family:var(--serif); font-size:23px; color:var(--qing); line-height:1.25}
.memstat .ms span{display:block; font-size:11.5px; color:var(--ink3); margin-top:2px; letter-spacing:.08em}
.tab i{font-style:normal; font-size:11px; margin-left:6px; opacity:.68}
