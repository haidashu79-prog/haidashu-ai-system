<title>小初高陪学团 · 知识地图</title>
<style>
:root{
  --ink:#0e4c54; --ink2:#123b40; --deep:#0a363c;
  --paper:#f6f4ef; --card:#ffffff; --line:#e3ded3;
  --txt:#1d2b2e; --sub:#5d6d70; --gold:#b8860b; --goldL:#f0e2bb;
  --ok:#2f7d5f; --warn:#b5651d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--paper); color:var(--txt); line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* 顶栏 */
.hd{position:sticky;top:0;z-index:50;background:rgba(14,76,84,.97);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08)}
.hd-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex:0 0 auto}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#1a7f8c,#0a363c);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;
  border:1px solid rgba(255,255,255,.22);flex:0 0 auto}
.brand b{color:#fff;font-size:16.5px;display:block;letter-spacing:.4px}
.brand i{color:#9fc4c9;font-style:normal;font-size:11.5px;letter-spacing:1.2px}
.search{position:relative;margin-left:auto;flex:1 1 300px;max-width:420px}
.search input{width:100%;padding:9px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);color:#fff;font-size:13.5px;outline:none;font-family:inherit}
.search input::placeholder{color:#8fb3b8}
.search input:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
.sug{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 14px 34px rgba(10,54,60,.16);max-height:390px;overflow:auto;display:none}
.sug.on{display:block}
.sug .si{padding:9px 13px;border-bottom:1px solid #f1eee7;cursor:pointer;font-size:13.5px}
.sug .si:last-child{border-bottom:none}
.sug .si:hover{background:#f7faf9}
.sug .si b{color:var(--ink)}
.sug .si span{color:var(--sub);font-size:12px;margin-left:6px}
.sug .sn{padding:9px 13px;color:var(--sub);font-size:12.5px}

/* 通用 */
main{min-height:calc(100vh - 150px);padding-bottom:60px}
.crumb{margin:22px 0 6px;font-size:13px;color:var(--sub)}
.crumb a{color:var(--ink);cursor:pointer;border-bottom:1px dotted #a9c0c2}
.crumb a:hover{color:var(--gold)}
h1.pg{font-size:25px;letter-spacing:.5px;margin:6px 0 4px;color:var(--ink2)}
.pgs{color:var(--sub);font-size:13.5px;margin-bottom:24px}
.sec-t{font-size:16.5px;color:var(--ink);margin:30px 0 12px;padding-left:11px;border-left:4px solid var(--gold)}
.hint{color:var(--sub);font-size:12.5px;font-weight:400;margin-left:8px}

/* 首页 */
.hero{padding:44px 0 10px;text-align:center}
.hero h2{font-size:31px;color:var(--ink2);letter-spacing:.6px}
.hero p{color:var(--sub);margin-top:10px;font-size:14.5px}
.hero .q{margin:20px auto 0;max-width:640px;color:var(--ink);font-size:14px;
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);
  padding:11px 16px;border-radius:0 10px 10px 0;text-align:left}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.gate:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(10,54,60,.11);border-color:#bcd3d5}
.gate .g-n{font-size:21px;color:var(--ink);font-weight:700}
.gate .g-r{color:var(--gold);font-size:12.5px;letter-spacing:1px;margin-top:2px}
.gate .g-s{color:var(--txt);font-size:13.5px;margin:13px 0 16px;min-height:44px}
.gate .g-m{display:flex;gap:16px;padding-top:13px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub)}
.gate .g-m b{color:var(--ink);font-size:16px}
.gate .line{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#1a7f8c,#0a363c)}

/* 学科网格 */
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}
.sub{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px;
  cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:9px}
.sub:hover{border-color:#bcd3d5;box-shadow:0 10px 24px rgba(10,54,60,.08);transform:translateY(-2px)}
.sub .s-n{font-size:16px;color:var(--ink2);font-weight:600}
.sub .s-f{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef5f5;color:var(--ink);border:1px solid #d5e5e6}
.tag.g{background:var(--goldL);color:#7a5a06;border-color:#e6d299}
.tag.e{background:#eef1ee;color:#68787a;border-color:#e0e4e0}
.sub .s-c{font-size:12.5px;color:var(--sub)}

/* 学科详情 */
.sj-head{background:linear-gradient(135deg,#12565f,#0a363c);border-radius:16px;padding:24px 26px;
  color:#fff;margin:10px 0 8px}
.sj-head h1{font-size:26px;letter-spacing:.5px}
.sj-head .m{color:#a9cdd2;font-size:13px;margin-top:7px}
.sj-head .n{display:flex;gap:26px;margin-top:16px;padding-top:15px;border-top:1px solid rgba(255,255,255,.14)}
.sj-head .n div{font-size:12px;color:#9fc4c9}
.sj-head .n b{display:block;color:#fff;font-size:20px;line-height:1.4}
.layout{display:grid;grid-template-columns:196px 1fr;gap:26px;margin-top:22px;align-items:start}
.toc{position:sticky;top:82px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px;font-size:13.5px}
.toc .tt{font-size:11.5px;color:var(--sub);letter-spacing:1.4px;margin-bottom:8px;padding-left:6px}
.toc a{display:block;padding:6px 9px;border-radius:7px;color:var(--txt);cursor:pointer;margin-bottom:1px}
.toc a:hover{background:#f1f6f6;color:var(--ink)}
.toc a.on{background:var(--ink);color:#fff}
.content{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px 22px;margin-bottom:16px}
.card h3{font-size:16.5px;color:var(--ink);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f0ece3}
.card h3 small{color:var(--sub);font-weight:400;font-size:12.5px;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #efece5;vertical-align:top}
th{background:#f3f7f7;color:var(--ink);font-weight:600;font-size:13px;border-bottom:1px solid #dde8e9}
td b{color:var(--ink)}
ol,ul{padding-left:22px;margin:9px 0;font-size:13.5px}
li{margin-bottom:5px}
p{margin:9px 0;font-size:13.5px}
.card p b,.card li b{color:var(--ink)}
.hl{background:#fff8e8;border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 9px 9px 0;margin:11px 0;font-size:13.5px}
.note{color:var(--sub);font-size:12.5px;margin-top:8px}

/* 图谱折叠 */
.lv1{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden;background:#fff}
.lv1>.h{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;background:#fbfcfb}
.lv1>.h:hover{background:#f3f7f7}
.lv1>.h .i{width:23px;height:23px;border-radius:7px;background:var(--ink);color:#fff;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lv1>.h .t{font-size:14.5px;color:var(--ink2);font-weight:600;flex:1}
.lv1>.h .c{font-size:12px;color:var(--sub)}
.lv1>.h .ar{color:var(--sub);width:12px;transition:.2s}
.lv1.on>.h .ar{transform:rotate(90deg)}
.lv1>.bd{display:none;padding:4px 15px 12px}
.lv1.on>.bd{display:block}

/* 题目 */
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 19px;margin-bottom:13px}
.q .qt{font-size:12px;color:var(--sub);display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.q .qt .d{padding:1px 8px;border-radius:20px;background:#f1f6f6;color:var(--ink);border:1px solid #dbe8e9}
.q .qt .d.j{background:#eef7f2;color:var(--ok);border-color:#d3e9dd}
.q .qt .d.g{background:#fdf3e8;color:var(--warn);border-color:#f0dcc4}
.q .stem{font-size:14.5px;margin-bottom:10px}
.q .opts{display:grid;gap:5px;font-size:14px;margin:9px 0}
.q .opts div{padding:4px 0}
.q .btns{margin-top:11px;display:flex;gap:9px}
.btn{padding:6px 15px;border-radius:8px;border:1px solid #cfe0e1;background:#f4f9f9;color:var(--ink);
  font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#e8f2f2;border-color:#a9c9cb}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.p:hover{background:var(--ink2)}
.ans{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ans.on{display:block}
.ans .a{font-size:14px;color:var(--ok);font-weight:600;margin-bottom:7px}
.ans .b{font-size:13.5px;margin:7px 0}
.ans .b i{font-style:normal;color:var(--ink);font-weight:600}
.ans .w{background:#fdf6ef;border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;margin-top:9px}

.empty{background:var(--card);border:1px dashed #d5cfc2;border-radius:13px;padding:26px;text-align:center;color:var(--sub);font-size:13.5px}

footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 0;color:var(--sub);font-size:12.5px;text-align:center;background:#f1eee7}
footer b{color:var(--ink)}

@media(max-width:900px){
  .gates,.subs{grid-template-columns:1fr 1fr}
  .layout{grid-template-columns:1fr}
  .toc{position:static;display:flex;flex-wrap:wrap;gap:3px}
  .toc .tt{width:100%}
}
@media(max-width:600px){
  .gates,.subs{grid-template-columns:1fr}
  .hd-in{flex-wrap:wrap;gap:10px}
  .search{max-width:none;flex-basis:100%;margin-left:0}
  .hero h2{font-size:24px}
  .sj-head .n{gap:16px;flex-wrap:wrap}
}

        + '</div>';
    }).join('');
    app.innerHTML =
      crumb([['首页','']])
      + '<h1 class="pg">'+name+'部</h1>'
      + '<div class="pgs">'+s['范围']+'　·　升学主线：'+s['主线']+'　·　'+s['口号']+'</div>'
      + '<div class="sec-t">选一门学科<span class="hint">共 '+s['学科数']+' 门 · '+s['节点数']+' 个节点</span></div>'
      + '<div class="subs">'+subs+'</div>';
  }

  /* ---------- 学科页 ---------- */
  function subject(seg, nm){
    var x = subjOf(seg, nm);
    if(!x){ ladder(seg); return; }
    var kb = x['课标'], tp = x['图谱'];
    var toc = [], body = [];

    // 课标各节
    if(kb){
      kb['节'].forEach(function(sec, i){
        if(/待办/.test(sec['标题'])) return;
        var id = 'sec'+i;
        toc.push(['课标 · '+sec['标题'], id]);
        body.push('<div class="card" id="'+id+'"><h3>'+rich(sec['标题'])+'</h3>'+blocks(sec['块'])+'</div>');
      });
    }

    // 知识图谱
    if(tp && tp['一级'] && tp['一级'].length){
      var id = 'tupu';
      toc.push(['知识图谱（'+tp['统计']['三级']+' 节点）', id]);
      var lv = tp['一级'].map(function(v, i){
        var rows = v['节点'].map(function(nd){
          return '<tr><td>'+rich(nd['名'])+'</td><td>'+rich(nd['章节'])+'</td></tr>';
        }).join('');
        return '<div class="lv1'+(i===0?' on':'')+'">'
          + '<div class="h" onclick="tg(this)"><span class="i">'+(i+1)+'</span>'
          + '<span class="t">'+rich(v['名'])+'</span>'
          + '<span class="c">'+v['节点'].length+' 个节点</span><span class="ar">▸</span></div>'
          + '<div class="bd"><table><tr><th>知识节点</th><th>教材章节</th></tr>'+rows+'</table></div>'
          + '</div>';
      }).join('');
      body.push('<div class="card" id="'+id+'"><h3>知识图谱<small>一级 → 三级，点开看细节</small></h3>'
        + lv + (tp['目标']?'<div class="note">'+rich(tp['目标'])+'</div>':'') + '</div>');
    }

    // 练习
    if(x['题库'] && x['题库'].length){
      var id = 'lian';
      toc.push(['配套练习', id]);
      var qs = '';
      x['题库'].forEach(function(bank){
        qs += '<div class="note" style="margin-bottom:10px">板块：<b>'+rich(bank['板块'])+'</b>　·　'
          + bank['题量']+' 道　·　'+rich(bank['适用']||'')+'</div>';
        bank['题目'].forEach(function(q, i){
          var opts = (q['选项']||[]).map(function(o,k){
            return '<div>'+(q['题型']==='选择题'?'ABCD'[k]+'. ':'')+rich(o)+'</div>';
          }).join('');
          qs += '<div class="q">'
            + '<div class="qt"><span class="d">'+rich(q['题型'])+'</span>'
            + '<span class="d '+({"\u57fa\u7840":"j","\u5de9\u56fa":"","\u62d4\u9ad8":"g"}[q['难度档']]||'')+'">'+rich(q['难度档'])+'</span>'
            + '<span>'+rich(q['章节单元']||'')+'</span></div>'
            + '<div class="stem">'+(i+1)+'. '+rich(q['题干'])+'</div>'
            + (opts?'<div class="opts">'+opts+'</div>':'')
            + '<div class="btns"><button class="btn p" onclick="ans(this)">看答案与解析</button></div>'
            + '<div class="ans"><div class="a">答案：'+rich(q['答案'])+'</div>'
            + '<div class="b"><i>解析：</i>'+rich(q['解析'])+'</div>'
            + (q['易错点']?'<div class="w"><b>易错点：</b>'+rich(q['易错点'])+'</div>':'')
            + '</div></div>';
        });
      });
      body.push('<div class="card" id="'+id+'"><h3>配套练习<small>先自己做，再看答案</small></h3>'+qs+'</div>');
    }

    // 目录
    var tocHtml = '<div class="toc"><div class="tt">本页内容</div>'
      + toc.map(function(t,i){ return '<a href="#'+t[1]+'" data-t="'+t[1]+'" onclick="jump(this)">'+rich(t[0])+'</a>'; }).join('')
      + '</div>';

    app.innerHTML =
      crumb([['首页',''], [seg+'部', seg], [x['短名'], '']])
      + '<div class="sj-head"><h1>'+rich(x['名'])+'</h1>'
      + '<div class="m">'+rich((kb&&kb['适用范围'])||'')+'　·　'+(kb?rich(kb['出处']):'')+'</div>'
      + '<div class="n"><div><b>'+x['节点数']+'</b>知识节点</div>'
      + '<div><b>'+((tp&&tp['一级'])?tp['一级'].length:0)+'</b>知识大块</div>'
      + '<div><b>'+((x['题库']||[]).reduce(function(a,b){return a+b['题量'];},0))+'</b>练习题</div></div></div>'
      + '<div class="layout">'+tocHtml+'<div class="content">'+body.join('')+'</div></div>';

    window.tg = function(el){
      var p = el.parentNode;
      p.className = p.className.indexOf(' on')>-1 ? 'lv1' : 'lv1 on';
    };
    window.ans = function(btn){
      var d = btn.parentNode.nextElementSibling;
      var on = d.className.indexOf(' on')>-1;
      d.className = on ? 'ans' : 'ans on';
      btn.textContent = on ? '看答案与解析' : '收起';
    };
    window.jump = function(a){
      var el = document.getElementById(a.getAttribute('data-t'));
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    };
  }

  function crumb(items){
    return '<div class="crumb">' + items.map(function(it, i){
      var last = i===items.length-1;
      return last ? '<span>'+rich(it[0])+'</span>'
        : '<a onclick="go(\''+it[1]+'\')">'+rich(it[0])+'</a>';
    }).join(' <span style="color:#c4bcae">/</span> ') + '</div>';
  }

  /* ---------- 搜索 ---------- */
  function search(kw){
    kw = (kw||'').trim();
    var sug = document.getElementById('sug');
    if(kw.length < 1){ sug.className='sug'; return; }
    var hits = [];
    D['学段'].forEach(function(seg){
      seg['学科'].forEach(function(s){
        if(s['短名'].indexOf(kw)>-1 || s['名'].indexOf(kw)>-1){
          hits.push({t:1, seg:seg['名'], subj:s['名'], txt:s['名'], r:'学科 · '+seg['名']+'部'});
        }
        var tp = s['图谱'];
        if(tp && tp['一级']) tp['一级'].forEach(function(v){
          if(v['名'].indexOf(kw)>-1)
            hits.push({t:2, seg:seg['名'], subj:s['名'], txt:v['名'], r:'知识块 · '+seg['名']+s['短名']});
          v['节点'].forEach(function(nd){
            if(nd['名'].indexOf(kw)>-1)
              hits.push({t:3, seg:seg['名'], subj:s['名'], txt:nd['名'], r:'节点 · '+seg['名']+s['短名'], ch:nd['章节']});
          });
        });
      });
    });
    hits = hits.slice(0, 40);
    if(!hits.length){ sug.innerHTML = '<div class="sn">没找到「'+esc(kw)+'」，换个词试试（如：函数、细胞、辛亥革命）</div>'; sug.className='sug on'; return; }
    sug.innerHTML = hits.map(function(h){
      return '<div class="si" onclick="pick(\''+h.seg+'\',\''+h.subj+'\')"><b>'+rich(h.txt)+'</b>'
        + '<span>'+esc(h.r)+(h.ch?'　'+esc(h.ch):'')+'</span></div>';
    }).join('');
    sug.className = 'sug on';
  }

  window.pick = function(seg, subj){
    document.getElementById('q').value='';
    document.getElementById('sug').className='sug';
    location.hash = seg + '/' + subj;
  };

  /* ---------- 路由 ---------- */
  window.go = function(h){ location.hash = h; };
  function route(){
    var h = decodeURIComponent(location.hash.replace(/^#/,''));
    var parts = h.split('/').filter(Boolean);
    document.getElementById('sug').className='sug';
    if(parts.length===0) home();
    else if(parts.length===1) ladder(parts[0]);
    else subject(parts[0], parts[1]);
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  document.getElementById('q').addEventListener('input', function(e){ search(e.target.value); });
  document.getElementById('q').addEventListener('focus', function(e){ search(e.target.value); });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search')) document.getElementById('sug').className='sug';
  });
  route();
})();
</script>

      });
